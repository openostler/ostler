# Ostler event API: the Server-Sent Events stream of src/openostler/web/server.py (_Handler._sse).
# AsyncAPI 3.0 (ADR-0017). Payload schemas are shared with api/openapi.yaml by $ref, so the
# snapshot has one definition. The node's MQTT 5 channels the Brain consumes (NodeSource,
# specs/2026-10-06-node-source-design.md §8) are here too; the outbound MQTT exports (Home
# Assistant discovery, the OVMS alias tree, OwnTracks) arrive with U5.
# tests/test_api_contracts.py checks this file. See api/README.md.
asyncapi: 3.0.0
info:
  title: Ostler
  version: 0.0.1
  description: |
    The live event stream the Ostler server pushes to its UI.

    **Today:** one SSE channel, `GET /events`. The server writes one unnamed message,
    `data: <Snapshot JSON>\n\n`, every `stream_interval` seconds (default 0.5 s) until the
    client disconnects. It sends no `event:`, `id:` or `retry:` fields, so a browser
    `EventSource` delivers every message to `onmessage` and reconnects by itself. Each
    message is the whole current snapshot, not a delta. The UI primes itself from
    `GET /snapshot`, which returns the same object (`ui/src/api/useSnapshot.ts`).

    **Wire conventions** are those of `api/openapi.yaml`
    (`components.x-ostler-wire-conventions`): RFC 3339 UTC `Z` timestamps for new fields,
    COVESA VSS units (ADR-0016), GeoJSON (RFC 7946) positions and traces, `vid` on
    sessions. The snapshot carries `ts_utc`, `recording.since_utc` and
    `active_test.since_utc`; the epoch-seconds `ts`, `recording.since` and
    `active_test.since` are deprecated and go in 0.2.0. The stream's response sends
    `Deprecation` (RFC 9745) and a `Link rel="deprecation"` while they remain.

    **Node channels (MQTT 5, consumed by the Brain).** A node publishes its state on the
    `brain-broker` server (the Brain's Mosquitto, bridged to the node's broker; or the
    node's own broker in the lab): `status`, `power` and one retained `vss/<leaf>` topic per
    value. The Brain's NodeSource subscribes read-only (No Local on, Retain As Published
    off, Retain Handling 0, clean start, session expiry 0) and turns them into the snapshot
    (NodeSource spec §4, §6). While a session records, a second connection (client id
    `<id>-tap`, session expiry 60 s) subscribes to the raw tap, `tap/<session>/meta` and
    `tap/<session>/data` (P2; never `tap/ctl`), and unsubscribes when the session ends. The
    module-bus message spec will own these schemas; they move there when it lands.
    Manifest, role, wake and request channels arrive with their phases (P3, P4).

    **Coming:** the outbound MQTT exports at U5 (standards research §2 and §8.2).
  license:
    name: AGPL-3.0-or-later
    url: https://spdx.org/licenses/AGPL-3.0-or-later.html
  tags:
    - name: live
defaultContentType: application/json

servers:
  device:
    host: localhost:8080
    protocol: http
    description: >
      The Ostler server on the device (a Pi in the car, or a laptop); local HTTPS per
      ADR-0021. The stream is public and also served in public mode.
  brain-broker:
    host: brain.local:8883
    protocol: secure-mqtt
    protocolVersion: "5"
    description: >
      The Brain's MQTT 5 broker (Mosquitto, an OS service; ADR-0027 §3), bridged to the
      node's parked broker while the Brain is awake. TLS 1.2+ with a client certificate
      from the Brain's local CA (mTLS, also on loopback; no passwords) and a per-device ACL
      (ADR-0026): the Brain reads only its own vehicle's state topics. Found by mDNS or a
      configured URL, never a hard-coded address.
    security:
      - $ref: "#/components/securitySchemes/mtls"

channels:
  events:
    address: /events
    title: Live snapshots (SSE)
    description: >
      `GET /events` answers `200 text/event-stream` with `Cache-Control: no-cache` and
      `Connection: keep-alive`. A query string is accepted (and ignored).
    servers:
      - $ref: "#/servers/device"
    messages:
      snapshot:
        $ref: "#/components/messages/snapshot"

  nodeStatus:
    address: "ostler/v1/{vid}/{device}/status"
    title: Node liveness
    description: >
      Retained, QoS 1, plain text (not JSON): `online` on connect; the node's will sets
      `offline` when its connection drops without a normal DISCONNECT (keep-alive 10 s).
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
    messages:
      status:
        $ref: "#/components/messages/nodeStatus"
  nodePower:
    address: "ostler/v1/{vid}/{device}/power"
    title: Node power state
    description: Retained, QoS 1. The ADR-0040 power record.
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
    messages:
      power:
        $ref: "#/components/messages/nodePower"
  nodeVss:
    address: "ostler/v1/{vid}/{device}/vss/{leaf}"
    title: Node values
    description: >
      Retained, QoS 0, one topic per value. `leaf` is a COVESA VSS path
      (`Vehicle.Speed`) or, for a pack field with no VSS path, `<pack>.<module>.<field>`
      with the platform's pack id (`lr_d2.td5.air_temp`).
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
      leaf:
        description: A VSS path or `<pack>.<module>.<field>` (one topic level).
    messages:
      value:
        $ref: "#/components/messages/nodeVss"

  nodeTapMeta:
    address: "ostler/v1/{vid}/{device}/tap/{session}/meta"
    title: Raw-tap session header
    description: >
      Retained, QoS 1, JSON (`ostler-firmware` `docs/specs/raw-tap.md` §2.1). Read only
      while a session records.
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
      session: {$ref: "#/components/parameters/tapSession"}
    messages:
      header:
        $ref: "#/components/messages/nodeTapMeta"
  nodeTapData:
    address: "ostler/v1/{vid}/{device}/tap/{session}/data"
    title: Raw-tap record batches
    description: >
      Not retained, QoS 1, binary (raw-tap §2.2): 20-byte little-endian record headers
      (`t_us` u64, `seq` u32, `type`, `bus`, `dir`/event, `proto` u8, `flags` u16, `len`
      u16) each followed by its payload; flushed every 100 ms or at 8 kB. The Brain writes
      them beside the session's CSV (`tap/<session>.otap`) after its identity check
      (ADR-0036).
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
      session: {$ref: "#/components/parameters/tapSession"}
    messages:
      batch:
        $ref: "#/components/messages/nodeTapData"

operations:
  receiveNodeStatus:
    action: receive
    title: The Brain receives node liveness
    channel:
      $ref: "#/channels/nodeStatus"
    messages:
      - $ref: "#/channels/nodeStatus/messages/status"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
  receiveNodePower:
    action: receive
    title: The Brain receives node power states
    channel:
      $ref: "#/channels/nodePower"
    messages:
      - $ref: "#/channels/nodePower/messages/power"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
  receiveNodeVss:
    action: receive
    title: The Brain receives node values
    channel:
      $ref: "#/channels/nodeVss"
    messages:
      - $ref: "#/channels/nodeVss/messages/value"
    bindings:
      mqtt: {qos: 0}
    x-ostler-consumer: brain
  receiveNodeTapMeta:
    action: receive
    title: The Brain receives raw-tap headers (while a session records)
    channel:
      $ref: "#/channels/nodeTapMeta"
    messages:
      - $ref: "#/channels/nodeTapMeta/messages/header"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
  receiveNodeTapData:
    action: receive
    title: The Brain receives raw-tap batches (while a session records)
    channel:
      $ref: "#/channels/nodeTapData"
    messages:
      - $ref: "#/channels/nodeTapData/messages/batch"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
  receiveSnapshot:
    action: receive
    title: Receive the live snapshot
    summary: The client receives the whole current snapshot every poll interval.
    channel:
      $ref: "#/channels/events"
    messages:
      - $ref: "#/channels/events/messages/snapshot"

components:
  securitySchemes:
    mtls:
      type: X509
      description: TLS client certificate issued by the Brain's local CA (ADR-0021, ADR-0027 §8).
  parameters:
    vid:
      description: The vehicle id (never a VIN; a VIN-shaped vid is refused).
    device:
      description: The publishing device's id (its node config `node.name`).
    tapSession:
      description: The node's tap session id (a ULID).
  messages:
    nodeStatus:
      name: nodeStatus
      title: Node status
      contentType: text/plain
      payload:
        type: string
        enum: [online, offline]
    nodePower:
      name: nodePower
      title: Node power record
      contentType: application/json
      payload:
        $ref: "./openapi.yaml#/components/schemas/NodePower"
      examples:
        - name: awake
          payload: {state: awake, since: "2026-10-06T10:00:00.000Z", since_us: 1000000, class: always,
                    wake_paths: [], next_checkin: null, leases: [], est_ma: null, reason: polling}
    nodeVss:
      name: nodeVss
      title: One node value
      contentType: application/json
      payload:
        type: object
        required: [value, unit, ts, t_us, source]
        properties:
          value: {type: number}
          unit: {type: string, description: "The pack store's display unit today (`°C`, `kg/hr`); converted to the VSS unit at U3."}
          ts: {type: [string, "null"], description: "RFC 3339 UTC when the node read it; null until SNTP."}
          t_us: {type: integer, minimum: 0, description: "The node's monotonic clock (µs)."}
          boot: {type: integer, minimum: 0, description: "The node's boot counter (the raw-tap header's boot_id); exact reboot detection. Absent on older nodes."}
          source: {type: string, description: "`<bus_id>/<module>/<request>`, e.g. `kline-diag/td5/21 09`."}
          name: {type: string, description: "The pack field name."}
          c: {type: string, description: "proven | candidate"}
          raw: {type: number}
          state: {type: string, description: "The field's enumeration label, when it has one."}
        additionalProperties: true
      examples:
        - name: rpm
          payload: {value: 780, unit: rpm, ts: "2026-10-06T10:00:00.000Z", t_us: 2490181, boot: 7,
                    source: "kline-diag/td5/21 09", name: rpm, c: proven, raw: 780}

    nodeTapMeta:
      name: nodeTapMeta
      title: Raw-tap session header
      contentType: application/json
      payload:
        type: object
        required: [v, session, node, boot_id, buses, scrub]
        properties:
          v: {const: 1}
          session: {type: string, description: "A ULID."}
          node: {type: string}
          boot_id: {type: integer, minimum: 0, description: "The node's boot counter (NVS)."}
          buses:
            type: array
            items:
              type: object
              required: [idx, bus_id, proto]
              properties:
                idx: {type: integer, minimum: 0}
                bus_id: {type: string}
                proto: {type: string, description: "kline | can"}
              additionalProperties: true
          clock:
            type: object
            properties:
              source: {type: string, description: "ublox-pps | sntp | none"}
              synced: {type: boolean}
            additionalProperties: true
          scrub: {type: string, enum: ["on", "off"], description: "off only with the node's install-level option (ADR-0036); the Brain then scrubs unless its own option is on too."}
          filters: {type: array}
          started: {type: string}
        additionalProperties: true
      examples:
        - name: kline
          payload: {v: 1, session: 01M48AFR80CDXA0ZQ1XBS3VHSS, node: node, boot_id: 7,
                    buses: [{idx: 0, bus_id: kline-diag, proto: kline, baud: 10400}],
                    clock: {source: sntp, synced: true}, scrub: "on", filters: [],
                    records: kline_msg, started: "2026-10-06T10:00:00.000Z"}
    nodeTapData:
      name: nodeTapData
      title: Raw-tap record batch
      contentType: application/vnd.ostler.tap.v1
      payload:
        type: string
        format: binary
        description: Raw-tap v1 records, little-endian (raw-tap §2.2).

    snapshot:
      name: snapshot
      title: Snapshot
      summary: The live state of the active module, connection, GPS and recording.
      description: >
        Sent as the SSE `data:` field (no `event:` name, so the SSE event type is
        `message`). The object is open: clients ignore unknown fields.
      contentType: application/json
      payload:
        $ref: "./openapi.yaml#/components/schemas/Snapshot"
      examples:
        - name: connected
          summary: Td5 connected, idle, not recording (trimmed).
          payload:
            status: connected
            source: td5
            module: td5
            signals:
              rpm: {v: 777.21, u: rpm, s: ok, c: proven}
              coolant_temp: {v: 20.15, u: "°C", s: ok, c: proven}
            faults: []
            logging: {recording: false}
            public: false
            fault_watch: false
            allow_shutdown: false
            conn: connected
            ts: 1791226936.05
            ts_utc: "2026-10-05T19:42:16.050Z"
            battery_v: 14.07
            active_test: null
            gps: null
            recording: null
