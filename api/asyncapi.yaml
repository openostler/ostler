# Ostler event API: the Server-Sent Events stream of src/openostler/web/server.py (_Handler._sse).
# AsyncAPI 3.0 (ADR-0017). Payload schemas are shared with api/openapi.yaml by $ref, so the
# snapshot has one definition. The node's MQTT 5 channels the Brain consumes (NodeSource,
# specs/2026-10-06-node-source-design.md §8) are here too; the outbound MQTT exports (Home
# Assistant discovery, the OVMS alias tree, OwnTracks) arrive with U5.
# tests/test_api_contracts.py checks this file. See api/README.md.
asyncapi: 3.0.0
info:
  title: Ostler
  version: 0.0.1
  description: |
    The live event stream the Ostler server pushes to its UI.

    **Today:** one SSE channel, `GET /events`. The server writes one unnamed message,
    `data: <Snapshot JSON>\n\n`, every `stream_interval` seconds (default 0.5 s) until the
    client disconnects. It sends no `event:`, `id:` or `retry:` fields, so a browser
    `EventSource` delivers every message to `onmessage` and reconnects by itself. Each
    message is the whole current snapshot, not a delta. The UI primes itself from
    `GET /snapshot`, which returns the same object (`ui/src/api/useSnapshot.ts`).

    **Wire conventions** are those of `api/openapi.yaml`
    (`components.x-ostler-wire-conventions`): RFC 3339 UTC `Z` timestamps for new fields,
    COVESA VSS units (ADR-0016), GeoJSON (RFC 7946) positions and traces, `vid` on
    sessions. The snapshot carries `ts_utc`, `recording.since_utc` and
    `active_test.since_utc`; the epoch-seconds `ts`, `recording.since` and
    `active_test.since` are deprecated and go in 0.2.0. The stream's response sends
    `Deprecation` (RFC 9745) and a `Link rel="deprecation"` while they remain.

    **Node channels (MQTT 5, consumed by the Brain).** A node publishes its state on the
    `brain-broker` server (the Brain's Mosquitto, bridged to the node's broker; or the
    node's own broker in the lab): `status`, `power` and one retained `vss/<leaf>` topic per
    value. The Brain's NodeSource subscribes read-only (No Local on, Retain As Published
    off, Retain Handling 0, clean start, session expiry 0) and turns them into the snapshot
    (NodeSource spec §4, §6). While a session records, a second connection (client id
    `<id>-tap`, session expiry 60 s) subscribes to the raw tap, `tap/<session>/meta` and
    `tap/<session>/data` (P2; never `tap/ctl`), and unsubscribes when the session ends. P3
    adds each device's retained capability `manifest` and its role claims
    `role/<role>[/<scope>]` (ADR-0037 §3), read-only, for `GET /cluster`. The module-bus
    message spec v1.3 (`specs/2026-10-06-module-bus-messages-design.md`) owns these
    topics; from it the Brain also reads each device's retained whole fault list
    `faults/<pack>.<module>` (§6.2, into the snapshot's `faults`) and its events
    `event/<name>` (§6.1, QoS 1, de-duplicated by `id` into `GET /cluster/events` and the
    `clusterEvents` SSE stream), and the alarm state
    `vss/Vehicle.Ostler.Security.Alarm.State` at QoS 1 (§6, the one QoS 1 reading). The
    shapes of `tap/ctl`, `lab/req` and `lab/resp` are documented here for the firmware; the
    Brain sends and reads them, and the `act/` and `wake/` channels, from P4.

    **Coming:** the outbound MQTT exports at U5 (standards research §2 and §8.2).
  license:
    name: AGPL-3.0-or-later
    url: https://spdx.org/licenses/AGPL-3.0-or-later.html
  tags:
    - name: live
defaultContentType: application/json

servers:
  device:
    host: localhost:8080
    protocol: http
    description: >
      The Ostler server on the device (a Pi in the car, or a laptop); local HTTPS per
      ADR-0021. The stream is public and also served in public mode.
  brain-broker:
    host: brain.local:8883
    protocol: secure-mqtt
    protocolVersion: "5"
    description: >
      The Brain's MQTT 5 broker (Mosquitto, an OS service; ADR-0027 §3), bridged to the
      node's parked broker while the Brain is awake. TLS 1.2+ with a client certificate
      from the Brain's local CA (mTLS, also on loopback; no passwords) and a per-device ACL
      (ADR-0026): the Brain reads only its own vehicle's state topics. Found by mDNS or a
      configured URL, never a hard-coded address.
    security:
      - $ref: "#/components/securitySchemes/mtls"

channels:
  events:
    address: /events
    title: Live snapshots (SSE)
    description: >
      `GET /events` answers `200 text/event-stream` with `Cache-Control: no-cache` and
      `Connection: keep-alive`. A query string is accepted (and ignored).
    servers:
      - $ref: "#/servers/device"
    messages:
      snapshot:
        $ref: "#/components/messages/snapshot"

  clusterEvents:
    address: /cluster/events/stream
    title: Device events (SSE)
    description: >
      `GET /cluster/events/stream` answers `200 text/event-stream`: one `event: node_event`
      per device event, `id:` the Brain's `seq`, `data:` the `NodeEvent` JSON; a comment
      line every 15 s while there is none. A reconnect resumes after `Last-Event-ID`.
      Refused in public mode; 503 without a node source.
    servers:
      - $ref: "#/servers/device"
    messages:
      nodeEvent:
        $ref: "#/components/messages/clusterEvent"

  nodeStatus:
    address: "ostler/v1/{vid}/{device}/status"
    title: Node liveness
    description: >
      Retained, QoS 1, plain text (not JSON): `online` on connect; the node's will sets
      `offline` when its connection drops without a normal DISCONNECT (keep-alive 10 s);
      `asleep` before a clean sleep (ADR-0037 Amendment 8, ADR-0040 §1).
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
    messages:
      status:
        $ref: "#/components/messages/nodeStatus"
  nodePower:
    address: "ostler/v1/{vid}/{device}/power"
    title: Node power state
    description: Retained, QoS 1. The ADR-0040 power record.
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
    messages:
      power:
        $ref: "#/components/messages/nodePower"
  nodeVss:
    address: "ostler/v1/{vid}/{device}/vss/{leaf}"
    title: Node values
    description: >
      Retained, QoS 0, one topic per value. `leaf` is a COVESA VSS path
      (`Vehicle.Speed`) or, for a pack field with no VSS path, `<pack>.<module>.<field>`
      with the platform's pack id (`lr_d2.td5.air_temp`). When two modules decode one VSS
      path, the node publishes the VSS leaf only from the pack's `primary` field and the
      other under its pack leaf (module-bus spec v1.3 §6); the Brain's selection prefers a
      usable primary. The alarm state `Vehicle.Ostler.Security.Alarm.State` (`DISARMED`,
      `ARMING`, `ARMED`, `TRIGGERED`; `value` its index, `state` the label) is published
      and subscribed at QoS 1, the spec's one exception.
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
      leaf:
        description: A VSS path or `<pack>.<module>.<field>` (one topic level).
    messages:
      value:
        $ref: "#/components/messages/nodeVss"

  nodeManifest:
    address: "ostler/v1/{vid}/{device}/manifest"
    title: Device capability manifest
    description: >
      Retained, QoS 1, JSON: the device's capability manifest (UI spec §5.1 device entry;
      `ostler-firmware` `docs/specs/sensor-detection.md` §7), republished with a new `etag`
      whenever it changes; an empty retained payload clears it. Topic name pending the
      module-bus message spec (NodeSource spec §4). The node firmware does not publish it
      yet.
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
    messages:
      manifest:
        $ref: "#/components/messages/nodeManifest"
  nodeRole:
    address: "ostler/v1/{vid}/{device}/role/{role}"
    title: Role claim (vehicle-scoped roles)
    description: >
      Retained, QoS 1, JSON (ADR-0037 §3): the device's claim on a single-holder role
      (`pbroker`, `time`, `uplink`); an empty retained payload releases it. Only that
      device may publish here (per-device ACL, ADR-0026). The node firmware does not
      publish claims yet.
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
      role: {$ref: "#/components/parameters/role"}
    messages:
      claim:
        $ref: "#/components/messages/nodeRoleClaim"
  nodeRoleScoped:
    address: "ostler/v1/{vid}/{device}/role/{role}/{scope}"
    title: Role claim (scoped roles)
    description: >
      As `nodeRole`, for roles with a scope: `gate/<bus_id>` (never hands over; ADR-0037
      §2) and `plca/<segment>`.
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
      role: {$ref: "#/components/parameters/role"}
      scope:
        description: The role's scope (a bus id for `gate`, a T1S segment for `plca`).
    messages:
      claim:
        $ref: "#/components/messages/nodeRoleClaim"

  nodeFaults:
    address: "ostler/v1/{vid}/{device}/faults/{packModule}"
    title: Fault list
    description: >
      Retained, QoS 1, JSON (module-bus spec v1.3 §6.2): the device's whole current fault
      list for one module after every read, never a delta. `faults: []` with `status: ok`
      means read, none; an absent topic means not read; an empty retained payload clears
      it.
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
      packModule:
        description: "`<pack>.<module>` (`lr_d2.td5`; an OBD node `obd.<ecu>`)."
    messages:
      faults:
        $ref: "#/components/messages/nodeFaults"
  nodeEvent:
    address: "ostler/v1/{vid}/{device}/event/{name}"
    title: Device event
    description: >
      QoS 1, never retained, Message Expiry 3600 s, JSON (module-bus spec v1.3 §6.1):
      something happened (`alarm.triggered`, `gate.conflict`, `fault.new`). State stays in
      retained readings. Consumers de-duplicate by `id`.
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
      name:
        description: "The event name: one topic level, dotted and lower case."
    messages:
      event:
        $ref: "#/components/messages/nodeEvent"

  nodeTapCtl:
    address: "ostler/v1/{vid}/{device}/tap/ctl"
    title: Raw-tap control (P4, not sent yet)
    description: >
      QoS 1, not retained, JSON (module-bus spec v1.3 §8, owner answer 3), on the node's
      topic, published by the paired Brain or an owner-role client: `{op: start | stop,
      session, buses?, filters?}`, `session` the ULID the requester chose (the tap header's
      name). A repeated `start` for a running session and a `stop` for an unknown one are
      no-ops. Never bridged. Documented for the node firmware (a65c44d reads it); the Brain
      sends none until NodeSource P4.
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
    messages:
      ctl:
        $ref: "#/components/messages/nodeTapCtl"
  nodeLabReq:
    address: "ostler/v1/{vid}/{device}/lab/req"
    title: Lab request (P4, not sent yet)
    description: >
      QoS 1, not retained, Message Expiry Interval at most 10 s, JSON (spec §8): `{id,
      bus_id, service, grant?}` with `service` lower-case hex, no separators (`"2110"`).
      The node answers a repeated `id` with its first `lab/resp` without running it again
      (the last 16 ids). Lab reads run only in service mode; the node gate decides. Only the
      paired Brain may publish it; it travels on the Brain's broker and is never bridged.
      The Brain sends none until NodeSource P4.
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
    messages:
      req:
        $ref: "#/components/messages/nodeLabReq"
  nodeLabResp:
    address: "ostler/v1/{vid}/{device}/lab/resp"
    title: Lab response
    description: >
      QoS 1, not retained, JSON (spec §8): `{id, verdict, reply, t_us, reason?}`, `reply`
      lower-case hex. On the Brain's broker beside the tap; never bridged. Read by the Brain
      from NodeSource P4.
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
    messages:
      resp:
        $ref: "#/components/messages/nodeLabResp"

  nodeTapMeta:
    address: "ostler/v1/{vid}/{device}/tap/{session}/meta"
    title: Raw-tap session header
    description: >
      Retained, QoS 1, JSON (`ostler-firmware` `docs/specs/raw-tap.md` §2.1). Read only
      while a session records.
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
      session: {$ref: "#/components/parameters/tapSession"}
    messages:
      header:
        $ref: "#/components/messages/nodeTapMeta"
  nodeTapData:
    address: "ostler/v1/{vid}/{device}/tap/{session}/data"
    title: Raw-tap record batches
    description: >
      Not retained, QoS 1, binary (raw-tap §2.2): 20-byte little-endian record headers
      (`t_us` u64, `seq` u32, `type`, `bus`, `dir`/event, `proto` u8, `flags` u16, `len`
      u16) each followed by its payload; flushed every 100 ms or at 8 kB. Every publish
      carries the MQTT 5 Content Type `application/vnd.ostler.tap.v1` and one User Property
      `first_seq`, the decimal `seq` of the batch's first record (module-bus spec §8;
      raw-tap amendment of 2026-10-06; set by the firmware from 5971323). The Brain refuses
      a batch with another content type (counted `refused`), reads one without a content
      type or `first_seq` as v1 (`unlabelled`) and logs a `first_seq` that disagrees with
      the first record (`first_seq_mismatch`; the records' `seq` is kept). It writes the
      records beside the session's CSV (`tap/<session>.otap`) after its identity check
      (ADR-0036).
    servers:
      - $ref: "#/servers/brain-broker"
    parameters:
      vid: {$ref: "#/components/parameters/vid"}
      device: {$ref: "#/components/parameters/device"}
      session: {$ref: "#/components/parameters/tapSession"}
    messages:
      batch:
        $ref: "#/components/messages/nodeTapData"

operations:
  receiveNodeStatus:
    action: receive
    title: The Brain receives node liveness
    channel:
      $ref: "#/channels/nodeStatus"
    messages:
      - $ref: "#/channels/nodeStatus/messages/status"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
  receiveNodePower:
    action: receive
    title: The Brain receives node power states
    channel:
      $ref: "#/channels/nodePower"
    messages:
      - $ref: "#/channels/nodePower/messages/power"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
  receiveNodeVss:
    action: receive
    title: The Brain receives node values
    channel:
      $ref: "#/channels/nodeVss"
    messages:
      - $ref: "#/channels/nodeVss/messages/value"
    bindings:
      mqtt: {qos: 0}
    x-ostler-consumer: brain
  receiveNodeManifest:
    action: receive
    title: The Brain receives capability manifests
    channel:
      $ref: "#/channels/nodeManifest"
    messages:
      - $ref: "#/channels/nodeManifest/messages/manifest"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
  receiveNodeRole:
    action: receive
    title: The Brain receives role claims
    channel:
      $ref: "#/channels/nodeRole"
    messages:
      - $ref: "#/channels/nodeRole/messages/claim"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
  receiveNodeRoleScoped:
    action: receive
    title: The Brain receives scoped role claims (gate, PLCA)
    channel:
      $ref: "#/channels/nodeRoleScoped"
    messages:
      - $ref: "#/channels/nodeRoleScoped/messages/claim"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
  receiveNodeFaults:
    action: receive
    title: The Brain receives fault lists
    channel:
      $ref: "#/channels/nodeFaults"
    messages:
      - $ref: "#/channels/nodeFaults/messages/faults"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
  receiveNodeEvent:
    action: receive
    title: The Brain receives device events
    channel:
      $ref: "#/channels/nodeEvent"
    messages:
      - $ref: "#/channels/nodeEvent/messages/event"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
  receiveClusterEvents:
    action: receive
    title: Receive device events
    summary: The client receives each de-duplicated device event as it arrives.
    channel:
      $ref: "#/channels/clusterEvents"
    messages:
      - $ref: "#/channels/clusterEvents/messages/nodeEvent"
  sendNodeTapCtl:
    action: send
    title: Start or stop the node's raw tap (planned, NodeSource P4)
    channel:
      $ref: "#/channels/nodeTapCtl"
    messages:
      - $ref: "#/channels/nodeTapCtl/messages/ctl"
    bindings:
      mqtt: {qos: 1}
    x-ostler-status: planned
  sendNodeLabReq:
    action: send
    title: Send a lab request to the node (planned, NodeSource P4)
    channel:
      $ref: "#/channels/nodeLabReq"
    messages:
      - $ref: "#/channels/nodeLabReq/messages/req"
    bindings:
      mqtt: {qos: 1}
    x-ostler-status: planned
  receiveNodeLabResp:
    action: receive
    title: The Brain receives lab responses (planned, NodeSource P4)
    channel:
      $ref: "#/channels/nodeLabResp"
    messages:
      - $ref: "#/channels/nodeLabResp/messages/resp"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
    x-ostler-status: planned
  receiveNodeTapMeta:
    action: receive
    title: The Brain receives raw-tap headers (while a session records)
    channel:
      $ref: "#/channels/nodeTapMeta"
    messages:
      - $ref: "#/channels/nodeTapMeta/messages/header"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
  receiveNodeTapData:
    action: receive
    title: The Brain receives raw-tap batches (while a session records)
    channel:
      $ref: "#/channels/nodeTapData"
    messages:
      - $ref: "#/channels/nodeTapData/messages/batch"
    bindings:
      mqtt: {qos: 1}
    x-ostler-consumer: brain
  receiveSnapshot:
    action: receive
    title: Receive the live snapshot
    summary: The client receives the whole current snapshot every poll interval.
    channel:
      $ref: "#/channels/events"
    messages:
      - $ref: "#/channels/events/messages/snapshot"

components:
  securitySchemes:
    mtls:
      type: X509
      description: TLS client certificate issued by the Brain's local CA (ADR-0021, ADR-0027 §8).
  parameters:
    vid:
      description: The vehicle id (never a VIN; a VIN-shaped vid is refused).
    device:
      description: The publishing device's id (its node config `node.name`).
    tapSession:
      description: The node's tap session id (a ULID).
    role:
      description: "A single-holder role: gate, pbroker, time, plca or uplink (ADR-0037 §2)."
  messages:
    nodeStatus:
      name: nodeStatus
      title: Node status
      contentType: text/plain
      payload:
        type: string
        enum: [online, offline, asleep]
    nodePower:
      name: nodePower
      title: Node power record
      contentType: application/json
      payload:
        $ref: "./openapi.yaml#/components/schemas/NodePower"
      examples:
        - name: awake
          payload: {state: awake, since: "2026-10-06T10:00:00.000Z", since_us: 1000000, class: always,
                    wake_paths: [], next_checkin: null, leases: [], est_ma: null, reason: polling}
    nodeVss:
      name: nodeVss
      title: One node value
      contentType: application/json
      payload:
        type: object
        required: [value, unit, ts, t_us, source]
        properties:
          value: {type: number}
          unit: {type: string, description: "The pack store's display unit today (`°C`, `kg/hr`); converted to the VSS unit at U3."}
          ts: {type: [string, "null"], description: "RFC 3339 UTC when the node read it; null until SNTP."}
          t_us: {type: integer, minimum: 0, description: "The node's monotonic clock (µs)."}
          boot: {type: integer, minimum: 0, description: "The node's boot counter (the raw-tap header's boot_id); exact reboot detection. Absent on older nodes."}
          source: {type: string, description: "`<bus_id>/<module>/<request>`, e.g. `kline-diag/td5/21 09`."}
          name: {type: string, description: "The pack field name."}
          c: {type: string, description: "proven | candidate"}
          raw: {type: number}
          state: {type: string, description: "The field's enumeration label, when it has one."}
        additionalProperties: true
      examples:
        - name: rpm
          payload: {value: 780, unit: rpm, ts: "2026-10-06T10:00:00.000Z", t_us: 2490181, boot: 7,
                    source: "kline-diag/td5/21 09", name: rpm, c: proven, raw: 780}

    nodeManifest:
      name: nodeManifest
      title: Capability manifest
      contentType: application/json
      payload:
        $ref: "./openapi.yaml#/components/schemas/NodeManifest"
      examples:
        - name: diag-node
          summary: As the node firmware publishes it (`ostler-firmware` 5971323, host build).
          payload: {schema: 1, id: node, kind: node, variant: diag-port,
                    model: "Ostler Diagnostics (dev build)", board: host-sim, fw: "0.1.0",
                    priority: 10, memory: {psram_kb: 0}, roles: [],
                    transmit: [{bus_id: kline-diag}], links: [{kind: wifi}],
                    power: {class: check_in, wake_paths: [timer]},
                    items: [{bus: kline-diag, id: kline, kind: kline, origin: board, status: ok}],
                    etag: "0a06d9bf8150fb347a95feb3a4805e8333c0902024b9e429f3d3da880ff1b8fd"}
    nodeRoleClaim:
      name: nodeRoleClaim
      title: Role claim
      contentType: application/json
      payload:
        $ref: "./openapi.yaml#/components/schemas/RoleClaim"
      examples:
        - name: gate
          payload: {role: gate, scope: kline-diag, term: 1, priority: 10,
                    since: "2026-10-06T10:00:01.000Z", reason: wired}

    nodeFaults:
      name: nodeFaults
      title: Fault list
      contentType: application/json
      payload:
        type: object
        required: [status, faults]
        properties:
          module: {type: string}
          status: {type: string, enum: [ok, faults, error, unimplemented]}
          faults:
            type: array
            items:
              type: object
              required: [code]
              properties:
                code: {type: string}
                text: {type: string}
                state: {type: string}
                c: {type: string, description: "proven | candidate"}
              additionalProperties: true
          note: {type: string}
          ts: {type: [string, "null"]}
          t_us: {type: integer, minimum: 0}
          boot: {type: integer, minimum: 0}
          source: {type: string}
        additionalProperties: true
      examples:
        - name: none
          payload: {module: td5, status: ok, faults: [], ts: "2026-10-06T10:00:00.000Z",
                    t_us: 2490181, boot: 7, source: "kline-diag/td5/18 00"}
    nodeEvent:
      name: nodeEvent
      title: Device event
      contentType: application/json
      payload:
        type: object
        required: [id, name, severity]
        properties:
          id: {type: string, description: "A ULID; consumers de-duplicate by it."}
          name: {type: string}
          class: {type: string}
          severity: {type: string, enum: [info, warning, alarm]}
          ts: {type: [string, "null"]}
          t_us: {type: integer, minimum: 0}
          boot: {type: integer, minimum: 0}
          source: {type: string}
          cause: {type: string}
          text: {type: string}
        additionalProperties: true
      examples:
        - name: alarm
          payload: {id: 01J9ZK4Y6W8R3V5T7N2M1QXCDE, name: alarm.triggered, class: security,
                    severity: alarm, ts: "2026-10-06T10:00:00.000Z", t_us: 2490181, boot: 7,
                    cause: door}
    nodeTapCtl:
      name: nodeTapCtl
      title: Raw-tap control
      contentType: application/json
      payload:
        type: object
        required: [op, session]
        properties:
          op: {type: string, enum: [start, stop]}
          session: {type: string, description: "A ULID the requester chose."}
          buses: {type: array, items: {type: string}}
          filters: {type: array}
        additionalProperties: true
      examples:
        - name: start
          payload: {op: start, session: 01M48AFR80CDXA0ZQ1XBS3VHSS, buses: [kline-diag]}
    nodeLabReq:
      name: nodeLabReq
      title: Lab request
      contentType: application/json
      payload:
        type: object
        required: [id, bus_id, service]
        properties:
          id: {type: string}
          bus_id: {type: string}
          service: {type: string, pattern: "^([0-9a-f]{2})+$", description: "Lower-case hex, no separators."}
          grant: {type: string, description: "A transmit grant (spec §10), when the request needs one."}
        additionalProperties: true
      examples:
        - name: read
          payload: {id: 01M48AFZGZDM6TCY0PG02H4EN8, bus_id: kline-diag, service: "2110"}
    nodeLabResp:
      name: nodeLabResp
      title: Lab response
      contentType: application/json
      payload:
        type: object
        required: [id, verdict]
        properties:
          id: {type: string}
          verdict: {type: string, description: "The node gate's verdict (permitted, or a refusal code)."}
          reply: {type: [string, "null"], description: "Lower-case hex."}
          t_us: {type: integer, minimum: 0}
          reason: {type: string}
        additionalProperties: true
    clusterEvent:
      name: clusterEvent
      title: Device event (as the Brain received it)
      contentType: application/json
      payload:
        $ref: "./openapi.yaml#/components/schemas/NodeEvent"

    nodeTapMeta:
      name: nodeTapMeta
      title: Raw-tap session header
      contentType: application/json
      payload:
        type: object
        required: [v, session, node, boot_id, buses, scrub]
        properties:
          v: {const: 1}
          session: {type: string, description: "A ULID."}
          node: {type: string}
          boot_id: {type: integer, minimum: 0, description: "The node's boot counter (NVS)."}
          buses:
            type: array
            items:
              type: object
              required: [idx, bus_id, proto]
              properties:
                idx: {type: integer, minimum: 0}
                bus_id: {type: string}
                proto: {type: string, description: "kline | can"}
              additionalProperties: true
          clock:
            type: object
            properties:
              source: {type: string, description: "ublox-pps | sntp | none"}
              synced: {type: boolean}
            additionalProperties: true
          scrub: {type: string, enum: ["on", "off"], description: "off only with the node's install-level option (ADR-0036); the Brain then scrubs unless its own option is on too."}
          filters: {type: array}
          records:
            type: array
            items: {type: string}
            description: >
              The record kinds this session's batches may contain (raw-tap amendment of
              2026-10-06): data protocols by their raw-tap §2.2 `proto` name (`kline_byte`,
              `kline_msg`, `can`, `can_fd`) and events by their §2.3 name (`init`, `time`, …).
              A promise of what may appear, not that each kind does; readers ignore kinds
              they do not know. The node sends `["kline_msg", "time"]` (the first firmware
              sent the single string `"kline_msg"`, which the Brain reads as a one-item list).
          started: {type: string}
        additionalProperties: true
      examples:
        - name: kline
          payload: {v: 1, session: 01M48AFR80CDXA0ZQ1XBS3VHSS, node: node, boot_id: 7,
                    buses: [{idx: 0, bus_id: kline-diag, proto: kline, baud: 10400}],
                    clock: {source: sntp, synced: true}, scrub: "on", filters: [],
                    records: [kline_msg, time], started: "2026-10-06T10:00:00.000Z"}
    nodeTapData:
      name: nodeTapData
      title: Raw-tap record batch
      contentType: application/vnd.ostler.tap.v1
      headers:
        type: object
        description: >
          MQTT 5 User Properties of the publish (module-bus spec §8). The Content Type
          property is `application/vnd.ostler.tap.v1` (this message's `contentType`).
        required: [first_seq]
        properties:
          first_seq:
            type: string
            pattern: "^(0|[1-9][0-9]*)$"
            description: >
              The decimal `seq` of the batch's first record (the same value that record
              carries), so a consumer sees a gap before it parses the batch.
      bindings:
        mqtt:
          contentType: application/vnd.ostler.tap.v1
          bindingVersion: 0.2.0
      payload:
        type: string
        format: binary
        description: >
          Raw-tap v1 records, little-endian (raw-tap §2.2). `time` events (code 6, bus 0xFF)
          carry a CBOR map `{t_us, utc_ns, source, err_us}` (raw-tap amendment of
          2026-10-06); the Brain maps `t_us` to UTC from them.

    snapshot:
      name: snapshot
      title: Snapshot
      summary: The live state of the active module, connection, GPS and recording.
      description: >
        Sent as the SSE `data:` field (no `event:` name, so the SSE event type is
        `message`). The object is open: clients ignore unknown fields.
      contentType: application/json
      payload:
        $ref: "./openapi.yaml#/components/schemas/Snapshot"
      examples:
        - name: connected
          summary: Td5 connected, idle, not recording (trimmed).
          payload:
            status: connected
            source: td5
            module: td5
            signals:
              rpm: {v: 777.21, u: rpm, s: ok, c: proven}
              coolant_temp: {v: 20.15, u: "°C", s: ok, c: proven}
            faults: []
            logging: {recording: false}
            public: false
            fault_watch: false
            allow_shutdown: false
            conn: connected
            ts: 1791226936.05
            ts_utc: "2026-10-05T19:42:16.050Z"
            battery_v: 14.07
            active_test: null
            gps: null
            recording: null
