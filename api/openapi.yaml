# Ostler HTTP API: the routes of src/openostler/web/server.py (_Handler.do_GET/POST/PUT/PATCH/DELETE).
# OpenAPI 3.1.1; schemas are JSON Schema 2020-12 (ADR-0017). Shapes follow the UI's Zod
# schemas (ui/src/api/schemas.ts) and the real responses in ui/src/api/fixtures/.
# tests/test_api_contracts.py fails when a server route is missing here (or vice versa) and
# validates every fixture against its response schema. See api/README.md.
openapi: 3.1.1
info:
  title: Ostler
  summary: The open vehicle platform's local HTTP API (dashboard, logbook, replay, admin mapper).
  description: |
    The HTTP API the Ostler server (`openostler.web.server`) offers its own UI on the device
    (a Pi in the car, or a laptop). It is a stdlib `http.server`: there is no framework and
    no API versioning yet (routes get versioned at U6, ADR-0017 / standards research §8.2).

    **Access.** Every operation carries `x-ostler-access`:
    - `public`: no authentication.
    - `admin`: HTTP Basic auth (`adminBasic`). Only the password counts; the user name is
      ignored. When the server runs without `--admin-password`, admin routes are
      **ungated** (local development).

    **Public mode** (`--public`, the demo server). Every operation carries
    `x-ostler-public-mode`:
    - `open`: served as usual.
    - `filtered`: served, but only the pack's synthetic (demo) sessions exist; a real
      session answers 404 exactly like an unknown id (ADR-0009).
    - `refused`: answered 403 `not available in public mode`.
    - `hidden`: answered 404 (audio is never served in public mode).
    - `partial`: some commands are refused (actuator and service actions, `delete_session`,
      `split_session`); the reply is `{ok: false, error, code: public_mode}` with HTTP 403.

    **Errors.** Every API error is the JSON envelope `{ok: false, error, code?}`
    (`ErrorReply`): `error` is an English sentence for people, `code` a stable token for
    programs (`bad_request`, `auth_required`, `public_mode`, `not_local`, `read_only`,
    `not_found`, `not_recording`, `disconnected`, `community_off`, `conflict`, `too_large`,
    `internal`, `car_refused`, `car_timeout`, `unavailable`, `no_match`, and for stored
    layouts `park_to_edit`, `etag_mismatch`, `kind_not_writable`, `layout_invalid`,
    `layout_key`, `layout_class`, `base_missing`). A 2xx body never carries
    `ok: false`. The statuses: 202 accepted but not yet done (a queued community
    contribution, a layout write held until the car is Parked), 400 bad input, 401 admin auth missing, 403 refused by policy (public
    mode, a synthetic session, an owner action over a remote path), 404 unknown, 409 conflict with server state, 413 body too
    large, 416 bad range, 500 unexpected failure, 502 the car refused (an ECU negative
    response), 503 temporarily unavailable, 504 the car did not answer in time. Only the
    app pages answer HTML; their 401 has an empty body so the browser shows its Basic
    Auth prompt. An unknown `GET` whose `Accept` prefers `text/html` and whose path has no
    file extension answers 200 with the app shell (the UI shows its not-found view); any
    other unknown request answers the 404 envelope, as does a method the server lacks
    (501). A query string is accepted on every route.

    **Wire conventions** are documented in `components.x-ostler-wire-conventions` and as
    named schemas (`Rfc3339Utc`, `VssUnit`, `GeoJsonPosition`, `GeoJsonLineString`, `Vid`).

    **Live updates** are an SSE stream at `GET /events`; its messages are described in
    `api/asyncapi.yaml` (AsyncAPI 3.0).
  version: 0.0.1
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: http://localhost:8080
    description: A local dashboard (tools/dashboard.py; the port is configurable).
  - url: https://{device}
    description: The device over local HTTPS (ADR-0021).
    variables:
      device:
        default: ostler.local
security: []
tags:
  - name: app
    description: The single-page app and the legacy reference pages.
  - name: live
    description: The live snapshot, its SSE stream and commands.
  - name: metadata
    description: Read-only pack, module, field, fault and catalog metadata.
  - name: logbook
    description: The session logbook (ADR-0009, ADR-0011).
  - name: replay
    description: Notes, audio and acceleration on sessions (ADR-0010).
  - name: mapping
    description: The admin mapping console (sniff, automap, calibration, signal store write-back).
  - name: community
    description: The opt-in community contribution client.
  - name: docs
    description: The markdown Documents tab (admin).
  - name: layouts
    description: Stored UI layouts and the selected Drive mode per display (drive-modes spec §8.3; Park to edit).

paths:
  # ---------------------------------------------------------------- app (HTML) ---------
  /:
    $ref: "#/components/pathItems/AppShell"
  /index.html:
    $ref: "#/components/pathItems/AppShell"
  /v2:
    $ref: "#/components/pathItems/AppShell"
  /v2.html:
    $ref: "#/components/pathItems/AppShell"
  /admin:
    $ref: "#/components/pathItems/AdminShell"
  /admin/:
    $ref: "#/components/pathItems/AdminShell"
  /admin.html:
    $ref: "#/components/pathItems/AdminShell"
  /legacy/v2:
    $ref: "#/components/pathItems/LegacyV2"
  /legacy/v2.html:
    $ref: "#/components/pathItems/LegacyV2"
  /v1:
    $ref: "#/components/pathItems/LegacyV1"
  /v1.html:
    $ref: "#/components/pathItems/LegacyV1"
  /legacy/v1:
    $ref: "#/components/pathItems/LegacyV1"
  /legacy/v1.html:
    $ref: "#/components/pathItems/LegacyV1"
  /assets/{asset}:
    get:
      tags: [app]
      operationId: getAsset
      summary: A fingerprinted build asset of the app (cached for a year, immutable).
      x-ostler-access: public
      x-ostler-public-mode: open
      x-ostler-route: static
      parameters:
        - name: asset
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The file; the type follows its extension.
          headers:
            Cache-Control:
              schema: {type: string, const: "public, max-age=31536000, immutable"}
          content:
            "*/*":
              schema: {type: string, format: binary}
        "404":
          $ref: "#/components/responses/Error"
  /{file}:
    get:
      tags: [app]
      operationId: getStaticFile
      summary: Any other file of the built app (favicon, manifest …); `index.html` is never served here.
      description: >
        The fallback of `do_GET`: a path that no route matches is resolved inside the
        packaged `static/` directory (traversal-guarded). Nested paths are allowed. When no
        file matches, a browser page (`Accept` prefers `text/html`, no file extension in
        the path) gets the app shell so the UI can show its not-found view and deep links
        survive a reload; anything else gets the 404 envelope.
      x-ostler-access: public
      x-ostler-public-mode: open
      x-ostler-route: static
      parameters:
        - name: file
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: >
            The file (`Cache-Control: no-cache`; the type follows its extension), or the
            app shell (`text/html`) for an unknown browser page.
          content:
            "*/*":
              schema: {type: string, format: binary}
        "404":
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------- live ---------------
  /snapshot:
    get:
      tags: [live]
      operationId: getSnapshot
      summary: The latest snapshot (the same object `/events` pushes).
      x-ostler-access: public
      x-ostler-public-mode: open
      responses:
        "200":
          description: The latest snapshot.
          headers:
            Deprecation: {$ref: "#/components/headers/Deprecation"}
            Link: {$ref: "#/components/headers/DeprecationLink"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Snapshot"}
  /events:
    get:
      tags: [live]
      operationId: streamEvents
      summary: Server-Sent Events stream of snapshots (see api/asyncapi.yaml).
      description: >
        `text/event-stream`, one unnamed `data:` message holding a JSON `Snapshot` every
        `stream_interval` seconds, for as long as the client stays connected. No `event:`,
        `id:` or `retry:` fields are sent. Described message by message in
        `api/asyncapi.yaml`.
      x-ostler-access: public
      x-ostler-public-mode: open
      responses:
        "200":
          description: An endless SSE stream.
          headers:
            Deprecation: {$ref: "#/components/headers/Deprecation"}
            Link: {$ref: "#/components/headers/DeprecationLink"}
          content:
            text/event-stream:
              schema:
                type: string
                description: "`data: <Snapshot JSON>\\n\\n`, repeated."
  /command:
    post:
      tags: [live]
      operationId: postCommand
      summary: Run a server command or a module action (every module action passes the command gate, ADR-0008).
      description: |
        `action` is one of:
        - inline (answered at once): `start_csv`, `stop_csv`, `set_fault_watch {on}`,
          `shutdown` (only with `--allow-shutdown`), `delete_session {id}`,
          `recording_options {audio: off|pi, imu: off|on, accel_hz: 10|25|50, name?}`,
          `split_session`;
        - server (queued on the poll thread): `select_module {module}`, `read_all_faults`
          (45 s timeout), `connect`, `disconnect`, `set_port {port}`;
        - probes of an unknown car (queued, 45 s timeout), **Parked only**:
          `detect_protocol {confirm_parked}` (K-line auto-detection for a source with no
          profile; the reply carries `outcome`: ok, bus-busy, ecu-refused, init-failed or
          no-ecu, and the detected `link`) and `module_scan {confirm_parked, fast?, slow?}`
          (a read-only fast and 5-baud init sweep; the reply carries `scan`). Until the
          driving state (U2) exists both are refused (400, "probing an unknown car is
          allowed only when Parked") unless the server runs with `--kline-detect`,
          `params.confirm_parked` is `true` and nothing shows motion (a GPS fix at 3 km/h
          or more, or a speed signal above 0). Re-initialising a known profile is never
          gated;
        - generic source commands: `clear_faults`, `read_block`;
        - a module action from the pack's command registry (see `/catalog` actions), with
          optional `params.trust` for typed confirmation.

        The HTTP status is 200 when `ok` is true. Otherwise the reply's `code` sets it:
        400 an unknown action, bad params or a policy refusal (experimental without trust,
        gated, planned); 403 `public_mode` (refused on the public server) or `read_only`
        (`delete_session` of a synthetic session); 404 `not_found` (an unknown session);
        409 `not_recording` (`split_session`), `disconnected` or `conflict` (shutdown not
        enabled, the session is being recorded, or a node source is active and the command
        would open the serial port: `read_all_faults`, `set_port`, the probes; the Brain
        never touches the car, ADR-0032); 500 `internal`; 502 `car_refused` (the
        ECU answered with a negative response; `nrc` carries its code); 503 `unavailable`
        (no session recorder, or a module action on a node source: the node takes no
        requests yet); 504 `car_timeout` (the poll thread did not answer in time).
      x-ostler-access: public
      x-ostler-public-mode: partial
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommandRequest"}
      responses:
        "200":
          description: The command ran.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandReply"}
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          description: "The car refused: the ECU answered with a negative response (`code: car_refused`, `nrc`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
        "503":
          description: "Session recording is not available, or a node source takes no module actions yet (`code: unavailable`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
        "504":
          description: "The car did not answer in time: the poll thread timed out (`code: car_timeout`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}

  # ---------------------------------------------------------------- metadata -----------
  /pack:
    get:
      tags: [metadata]
      operationId: getPack
      summary: The active vehicle pack's manifest (modules, aliases, UI layout).
      x-ostler-access: public
      x-ostler-public-mode: open
      responses:
        "200":
          description: The manifest.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Pack"}
  /cluster:
    get:
      tags: [metadata]
      operationId: getCluster
      summary: The cluster view for the Network page (NodeSource spec §11, P3).
      description: >
        Built from what the devices under the vehicle id publish (retained `manifest`,
        `status`, `power` and `role/<role>[/<scope>]` claims, ADR-0037 §3), never
        authoritative: one row per device seen (kind, variant, model, board, firmware and
        manifest `etag`, "reached via" from the manifest's `links`, status, the whole
        ADR-0040 power record, last seen, its role claims) and one row per single-holder
        role (holder, term, since, candidates in order, the last change of holder the
        Brain saw live). A claim from a device that is offline or asleep, not declared by its
        manifest, not eligible or not checkable is shown void and flagged; two gate claims
        on one bus leave it with no holder and an alert. `stale` while the broker is not
        connected (the page is then read-only with its age). With a cable source the lists
        are empty and `note` says why. Read-only: nothing here acts on a device.
      x-ostler-access: public
      x-ostler-public-mode: refused
      responses:
        "200":
          description: The cluster view.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cluster"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /cluster/events:
    get:
      tags: [metadata]
      operationId: getClusterEvents
      summary: The devices' events feed (module-bus spec v1.3 §6.1).
      description: >
        Every `event/<name>` the devices under the vehicle id published (QoS 1, never
        retained), de-duplicated by the event's `id` (a ULID) and numbered by the Brain's
        `seq` in arrival order; the latest 200 are kept. `?after=<seq>` returns only newer
        ones, `?limit=` (1–200) the newest that many. Read-only. With a cable source the
        list is empty and `note` says why. The same events stream live from
        `/cluster/events/stream`.
      x-ostler-access: public
      x-ostler-public-mode: refused
      parameters:
        - {name: after, in: query, required: false, schema: {type: integer, minimum: 0}, description: "Only events with a higher `seq`."}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        "200":
          description: The events feed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodeEvents"}
        "400":
          description: "`after` or `limit` is not an integer (`code: bad_request`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /cluster/events/stream:
    get:
      tags: [metadata]
      operationId: streamClusterEvents
      summary: The devices' events as Server-Sent Events (see api/asyncapi.yaml).
      description: >
        `text/event-stream`: one `event: node_event` per event with `id: <seq>` and the
        `NodeEvent` JSON as `data:`; a comment line every 15 s while there is none. A
        reconnect resumes after `Last-Event-ID` (or `?after=<seq>`). 503 without a node
        source.
      x-ostler-access: public
      x-ostler-public-mode: refused
      parameters:
        - {name: after, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: Last-Event-ID, in: header, required: false, schema: {type: string}}
      responses:
        "200":
          description: An endless SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: "`id: <seq>\\nevent: node_event\\ndata: <NodeEvent JSON>\\n\\n`, repeated."
        "403": {$ref: "#/components/responses/Forbidden"}
        "503":
          description: "No node source (`code: unavailable`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
  /cluster/remove:
    post:
      tags: [metadata]
      operationId: postClusterRemove
      summary: The owner's Remove device (module-bus spec v1.3 §7.2, §13; UI spec §3.7).
      description: >
        Unpairs one device of the vehicle: the only way to clear a stale transmit-gate
        claim, which never expires. Owner only (the admin password until accounts land),
        **local links only** (loopback, a private, link-local or unique-local address, no
        proxy or relay header; Tailscale and public addresses are remote paths, whatever
        `OSTLER_ALLOW_REMOTE_CONTROL` says), never in public mode, with one confirmation
        (`confirm: true`; the UI names the buses in `buses` that become writable). The
        Brain records the device in its revocation list (the state directory's
        `removed_devices.json`) and ignores its messages from then on, runs the install's
        revoke hook for its certificate and ACL entry on the broker host (`revoked.broker`;
        `not configured` without one), then purges its retained topics under
        `ostler/v1/<vid>/<device>/#` on the Brain's broker as a broker-host operation: a
        broker-host connection (its own identity, `--mqtt-host-cert`) publishes an empty
        retained message to every retained topic the Brain saw from the device or finds
        there, then re-reads the tree. **Limits:** only the broker the Brain connects to
        (the node purges its parked broker itself); a device still connected can republish
        until the broker host revokes it; topics the host identity may not read are purged
        only if the Brain saw them. A purge that is refused or incomplete answers 503 with
        the same details (the revocation stays recorded).
      x-ostler-access: admin
      x-ostler-public-mode: refused
      security:
        - adminBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device, confirm]
              properties:
                device: {type: string, description: "The device id (one topic level)."}
                confirm: {const: true, description: "The owner's one confirmation."}
              additionalProperties: true
      responses:
        "200":
          description: Removed and purged.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RemoveDeviceReply"}
        "400":
          description: "No valid `device`, or no `confirm: true` (`code: bad_request`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Public mode (`code: public_mode`), or the request came over a remote path (`code: not_local`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
        "404":
          description: "No such device under the vehicle id (`code: not_found`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
        "409":
          description: "No node source (`code: conflict`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
        "413":
          $ref: "#/components/responses/TooLarge"
        "503":
          description: "Removed from this Brain, but the broker refused or did not finish the purge (`code: unavailable`); the body also carries the `RemoveDeviceReply` fields."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
  /version:
    get:
      tags: [metadata]
      operationId: getVersion
      summary: Platform and pack versions and commits (Settings → Version).
      x-ostler-access: public
      x-ostler-public-mode: open
      responses:
        "200":
          description: What is running.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VersionInfo"}
  /fields:
    get:
      tags: [metadata]
      operationId: getFields
      summary: Expected fields of a module with presentation metadata (from the signal store).
      x-ostler-access: public
      x-ostler-public-mode: open
      parameters:
        - $ref: "#/components/parameters/Module"
      responses:
        "200":
          description: The module's fields (an unknown module has none).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FieldsResponse"}
  /faults:
    get:
      tags: [metadata]
      operationId: getFaultMeanings
      summary: The fault-meaning dictionary of a module (the `dtc` store).
      x-ostler-access: public
      x-ostler-public-mode: open
      parameters:
        - $ref: "#/components/parameters/Module"
      responses:
        "200":
          description: The module's fault meanings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FaultsResponse"}
  /catalog:
    get:
      tags: [metadata]
      operationId: getCatalog
      summary: Without `module`, every module's summary; with it, that module's catalog pages.
      x-ostler-access: public
      x-ostler-public-mode: open
      parameters:
        - name: module
          in: query
          required: false
          description: A module id or legacy alias. Absent or empty → the module list.
          schema: {type: string}
      responses:
        "200":
          description: A `CatalogModules` list (no `module`) or one module's `Catalog`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CatalogModules"
                  - $ref: "#/components/schemas/Catalog"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          description: The catalog cannot be built (an import failed).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
  /map:
    get:
      tags: [mapping]
      operationId: getMap
      summary: The admin Map view of a module (pre-ADR-0008 menu shape) and per-module coverage.
      x-ostler-access: admin
      x-ostler-public-mode: open
      security:
        - adminBasic: []
      parameters:
        - $ref: "#/components/parameters/Module"
      responses:
        "200":
          description: The map.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MapResponse"}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /signals:
    get:
      tags: [mapping]
      operationId: getSignalRecords
      summary: The raw signal-store records of a writable module (the admin mapper's view).
      x-ostler-access: admin
      x-ostler-public-mode: open
      security:
        - adminBasic: []
      parameters:
        - $ref: "#/components/parameters/Module"
      responses:
        "200":
          description: The records (empty for a module the mapper may not write).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignalsResponse"}
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------- mapping (admin) ----
  /sniff:
    get:
      tags: [mapping]
      operationId: getSniff
      summary: The passive sniffer's latest frames per LID with their current decodes.
      x-ostler-access: admin
      x-ostler-public-mode: open
      security:
        - adminBasic: []
      parameters:
        - name: module
          in: query
          required: false
          description: The module to show; absent → the sniffer's own choice.
          schema: {type: string}
      responses:
        "200":
          description: 'The sniff view (`{module: null, modules: [], lids: []}` without a sniffer).'
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SniffResponse"}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /calib:
    post:
      tags: [mapping]
      operationId: postCalib
      summary: Solve scale and offset from (raw, displayed) samples and suggest a signal.
      x-ostler-access: admin
      x-ostler-public-mode: open
      security:
        - adminBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CalibRequest"}
      responses:
        "200":
          description: The fit and a suggested signal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CalibReply"}
        "400":
          description: Fewer than two samples with different raw values, a bad `lid`, or a body that is not JSON.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
  /automap:
    post:
      tags: [mapping]
      operationId: postAutomap
      summary: Search the raw field (offset, type, scale or byte.bit) that explains plaintext readings.
      x-ostler-access: admin
      x-ostler-public-mode: open
      security:
        - adminBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AutomapRequest"}
      responses:
        "200":
          description: The solution.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AutomapReply"}
        "400":
          description: >
            No usable readings (`code: bad_request`), or valid readings that no raw field
            explains (`code: no_match`, with the byte `diff`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorReply"
                  - $ref: "#/components/schemas/AutomapReply"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
  /capture:
    post:
      tags: [mapping]
      operationId: postCapture
      summary: Append a labelled capture to the captures file; also a `capture` note in the recording session.
      x-ostler-access: admin
      x-ostler-public-mode: open
      security:
        - adminBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CaptureRequest"}
      responses:
        "200":
          description: "`stored` is false when the server has no captures file."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OkReply"}
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          description: "The captures file could not be written (`code: internal`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
  /captures:
    get:
      tags: [mapping]
      operationId: getCaptures
      summary: Capture notes from every session merged with the captures file (one row per capture).
      x-ostler-access: admin
      x-ostler-public-mode: open
      security:
        - adminBasic: []
      parameters:
        - name: module
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: The captures.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaptureList"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Error"
  /signal:
    post:
      tags: [mapping]
      operationId: postSignal
      summary: Write a confirmed or candidate mapping back to the pack's signal store.
      x-ostler-access: admin
      x-ostler-public-mode: open
      security:
        - adminBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignalUpsertRequest"}
      responses:
        "200":
          description: Written.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OkReply"}
        "400":
          description: Unknown or read-only module, a record without name/lid/offset, or an invalid record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          description: "The signal store could not be written (`code: internal`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}

  # ---------------------------------------------------------------- docs (admin) -------
  /docs:
    get:
      tags: [docs]
      operationId: getDocs
      summary: The index of the Documents tab.
      x-ostler-access: admin
      x-ostler-public-mode: open
      security:
        - adminBasic: []
      responses:
        "200":
          description: The documents.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DocsResponse"}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /doc:
    get:
      tags: [docs]
      operationId: getDoc
      summary: One document rendered to an HTML fragment, fresh from the source.
      x-ostler-access: admin
      x-ostler-public-mode: open
      security:
        - adminBasic: []
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The fragment.
          content:
            text/html:
              schema: {type: string}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------- community ----------
  /community:
    get:
      tags: [community]
      operationId: getCommunity
      summary: The opt-in contribution state.
      x-ostler-access: public
      x-ostler-public-mode: open
      responses:
        "200":
          description: 'The state (`{consent: null, endpoint: null}` when community is disabled).'
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Community"}
  /community/consent:
    post:
      tags: [community]
      operationId: postCommunityConsent
      summary: Opt in or out of community contributions.
      description: Not admin-gated (the first-run Consent screen and Preferences belong to the device's own user); refused in public mode.
      x-ostler-access: public
      x-ostler-public-mode: refused
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                consent: {type: boolean}
                vehicle:
                  type: object
                  additionalProperties: {type: string}
              additionalProperties: true
      responses:
        "200":
          description: The new consent (registration fields when opting in).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OkReply"}
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/CommunityOff"
        "413":
          $ref: "#/components/responses/TooLarge"
  /community/contribute:
    post:
      tags: [community]
      operationId: postCommunityContribute
      summary: Contribute one whitelisted, PII-free record (queued when offline).
      description: Sent from the admin Coverage Map, so admin auth is required; refused in public mode.
      x-ostler-access: admin
      x-ostler-public-mode: refused
      security:
        - adminBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200":
          description: "Sent: `{ok: true, flushed}` (the queued ones drained with it)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OkReply"}
        "202":
          description: "Accepted but not yet sent (the endpoint is offline): `{ok: true, queued: true, error?, pending}`; it is sent on a later successful call."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkReply"
                  - type: object
                    required: [ok, queued]
                    properties:
                      ok: {const: true}
                      queued: {const: true}
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/CommunityOff"
        "413":
          $ref: "#/components/responses/TooLarge"

  # ---------------------------------------------------------------- logbook ------------
  /sessions:
    get:
      tags: [logbook]
      operationId: listSessions
      summary: One page of sessions, newest first (keyset paging through the SessionIndex).
      x-ostler-access: public
      x-ostler-public-mode: filtered
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, default: 50, description: Capped at 200.}
        - name: before
          in: query
          description: A `next` cursor from a previous page, or an ISO date/date-time (the scrubber). At most 120 characters.
          schema: {type: string, maxLength: 120}
        - name: q
          in: query
          description: Full-text search (name, description, place, notes); trimmed, at most 200 characters.
          schema: {type: string}
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
        - name: module
          in: query
          schema: {type: string}
        - name: has_notes
          in: query
          description: "`1`, `true` or `yes` keeps only sessions with notes."
          schema: {type: string}
        - name: min_km
          in: query
          schema: {type: number}
      responses:
        "200":
          description: 'A page (`{sessions: [], next: null}` without a logbook).'
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionList"}
        "400":
          $ref: "#/components/responses/Error"
        "503":
          description: The index is still being built and a filter was asked for.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
  /sessions/histogram:
    get:
      tags: [logbook]
      operationId: getSessionHistogram
      summary: Session counts and kilometres per month, or per day of one year (the scrubber).
      x-ostler-access: public
      x-ostler-public-mode: filtered
      parameters:
        - name: group
          in: query
          schema: {type: string, enum: [month, day], default: month}
        - name: year
          in: query
          schema: {type: integer}
      responses:
        "200":
          description: 'The buckets (`{group: month, buckets: []}` without a logbook).'
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionHistogram"}
        "400":
          $ref: "#/components/responses/Error"
        "503":
          description: The index is not ready.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}
  /sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [logbook]
      operationId: getSession
      summary: One session's metadata.
      x-ostler-access: public
      x-ostler-public-mode: filtered
      responses:
        "200":
          description: The metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionMeta"}
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [logbook]
      operationId: patchSession
      summary: Edit a session's name and/or description (trimmed, capped at 80 / 2000 characters; empty → null).
      x-ostler-access: public
      x-ostler-public-mode: refused
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionPatch"}
      responses:
        "200":
          description: The updated metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionMetaReply"}
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/TooLarge"
  /sessions/{id}/data:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [logbook]
      operationId: getSessionData
      summary: Columnar replay data, decimated to at most `max` points.
      x-ostler-access: public
      x-ostler-public-mode: filtered
      parameters:
        - name: ch
          in: query
          description: Comma-separated channel names; absent → none (time, UTC and the trace only).
          schema: {type: string}
        - name: max
          in: query
          schema: {type: integer, minimum: 2, default: 2000}
      responses:
        "200":
          description: The data.
          headers:
            Deprecation: {$ref: "#/components/headers/Deprecation"}
            Link: {$ref: "#/components/headers/DeprecationLink"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionData"}
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /sessions/{id}/export:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [logbook]
      operationId: exportSession
      summary: Download a session as CSV, VBO, GPX 1.1, GeoJSON, a notes CSV or its raw tap as pcapng.
      x-ostler-access: public
      x-ostler-public-mode: filtered
      parameters:
        - name: fmt
          in: query
          description: >
            `geojson` is an RFC 7946 FeatureCollection: one LineString Feature of every GPS
            point with `coordTimes` (RFC 3339 UTC), `t_ms`, `id` and `start_utc`, plus a
            Point Feature per note (`kind`, `text`, `tags`, `t_ms`, `time`).
            `pcapng` is a node session's raw tap (NodeSource spec §7): one interface per
            tap session and bus (K-line as `LINKTYPE_USER0`, CAN as
            `LINKTYPE_CAN_SOCKETCAN`, events as `LINKTYPE_USER1`), timestamps on the node's
            monotonic clock (µs since boot, not UTC), `seq` gaps as packet comments and
            interface drop counts. Identity replies are scrubbed and unframed records
            dropped whatever the install setting (ADR-0036 §3). A session with no tap
            answers 400.
          schema: {type: string, enum: [csv, vbo, gpx, geojson, notes, pcapng], default: csv}
      responses:
        "200":
          description: 'An attachment (`Content-Disposition: attachment; filename="…"`).'
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
            text/plain:
              schema: {type: string, description: VBO (Racelogic).}
            application/gpx+xml:
              schema: {type: string}
            application/geo+json:
              schema: {type: object, description: A GeoJSON FeatureCollection.}
            application/x-pcapng:
              schema: {type: string, format: binary, description: "pcapng (one section, little-endian)."}
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /sessions/{id}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [replay]
      operationId: getSessionEvents
      summary: The session's event log (events.jsonl); the open session is flushed first.
      x-ostler-access: public
      x-ostler-public-mode: filtered
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionEvents"}
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /sessions/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [replay]
      operationId: listNotes
      summary: The session's notes.
      x-ostler-access: public
      x-ostler-public-mode: filtered
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteList"}
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags: [replay]
      operationId: addNote
      summary: Add a note at a session time (a retro note by default).
      x-ostler-access: public
      x-ostler-public-mode: refused
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteCreate"}
      responses:
        "200":
          description: The note.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteReply"}
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/TooLarge"
  /sessions/{id}/notes/{nid}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/NoteId"
    patch:
      tags: [replay]
      operationId: editNote
      summary: Edit a note's text, tags, t or t_end.
      x-ostler-access: public
      x-ostler-public-mode: refused
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotePatch"}
      responses:
        "200":
          description: The edited note.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteReply"}
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/TooLarge"
    delete:
      tags: [replay]
      operationId: deleteNote
      summary: Delete a note.
      x-ostler-access: public
      x-ostler-public-mode: refused
      responses:
        "200":
          description: 'Deleted (`{ok: true}`).'
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteReply"}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
  /sessions/{id}/audio:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [replay]
      operationId: putAudioChunk
      summary: One chunk of a phone audio track into the session being recorded.
      x-ostler-access: public
      x-ostler-public-mode: refused
      parameters:
        - name: track
          in: query
          required: true
          schema: {type: string, pattern: "^[0-9A-Za-z][0-9A-Za-z_-]{0,63}$"}
        - name: seq
          in: query
          required: true
          schema: {type: integer, minimum: 0}
        - name: mime
          in: query
          schema: {type: string, default: audio/webm}
        - name: start_utc
          in: query
          description: The track's start, an RFC 3339 date-time in UTC. Wins over `start`.
          schema: {$ref: "#/components/schemas/Rfc3339Utc"}
        - name: start
          in: query
          description: The track's start, epoch milliseconds. Use `start_utc`.
          deprecated: true
          x-ostler-removed-in: "0.2.0"
          schema: {type: number}
        - name: end
          in: query
          description: "`1` or `true` closes the track after this chunk."
          schema: {type: string}
      requestBody:
        required: true
        description: The raw chunk, at most 2 MiB.
        content:
          "*/*":
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AudioChunkReply"}
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/NotRecording"
        "413":
          $ref: "#/components/responses/TooLarge"
  /sessions/{id}/audio/{track}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: track
        in: path
        required: true
        schema: {type: string, pattern: "^[0-9A-Za-z][0-9A-Za-z_-]{0,63}$"}
    get:
      tags: [replay]
      operationId: getAudioTrack
      summary: A session's audio track, with single-range HTTP Range support. Never in public mode.
      x-ostler-access: public
      x-ostler-public-mode: hidden
      parameters:
        - name: Range
          in: header
          required: false
          description: A single `bytes=` range; multi-range requests are served whole.
          schema: {type: string}
      responses:
        "200":
          description: The whole track.
          headers:
            Accept-Ranges:
              schema: {type: string, const: bytes}
          content:
            audio/*:
              schema: {type: string, format: binary}
        "206":
          description: The requested range.
          headers:
            Content-Range:
              schema: {type: string}
          content:
            audio/*:
              schema: {type: string, format: binary}
        "404":
          $ref: "#/components/responses/Error"
        "416":
          description: 'Unsatisfiable range (`Content-Range: bytes */<size>`, empty body).'
  /sessions/{id}/accel:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [replay]
      operationId: putAccel
      summary: Acceleration samples into the session being recorded (at most 5000 per request).
      x-ostler-access: public
      x-ostler-public-mode: refused
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccelRequest"}
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccelReply"}
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/NotRecording"
        "413":
          $ref: "#/components/responses/TooLarge"
  /sessions/{id}/accel_cal:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [replay]
      operationId: putAccelCal
      summary: Set the sensor-to-vehicle rotation of the session being recorded.
      x-ostler-access: public
      x-ostler-public-mode: refused
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccelCalRequest"}
      responses:
        "200":
          description: Stored (also written to meta.accel_cal and the event log).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccelCalReply"}
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/NotRecording"
        "413":
          $ref: "#/components/responses/TooLarge"
  /notes/live:
    post:
      tags: [replay]
      operationId: addLiveNote
      summary: A note stamped "now" in the recording session (refused unless a session is recording).
      x-ostler-access: public
      x-ostler-public-mode: refused
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LiveNote"}
      responses:
        "200":
          description: The note and its session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteReply"}
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/NotRecording"
        "413":
          $ref: "#/components/responses/TooLarge"
        "503":
          description: The server has no session recorder.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorReply"}

  # ---------------------------------------------------------------- stored UI layouts --
  # drive-modes spec §8.1 R1/R7, §8.3 (DM2): src/openostler/web/layout_api.py over the
  # ui_layouts store (<state dir>/settings.sqlite). Writes need Parked on a driver-facing
  # display (Park to edit); see the LayoutClassHeader parameter.
  /ui/layouts/{vid}/{profile}/{class}:
    parameters:
      - $ref: "#/components/parameters/LayoutVid"
      - $ref: "#/components/parameters/LayoutProfile"
      - $ref: "#/components/parameters/LayoutClass"
    get:
      tags: [layouts]
      operationId: listLayouts
      summary: Every stored or pack layout at this key, resolved (user → car → pack), with held changes and the Before reset snapshot.
      description: >
        The shell's own presets and generated defaults (tier 1) are not listed: the shell
        knows them. Held changes made from a tablet or desktop for a driver-facing class
        are applied here once the car is Parked (R7).
      x-ostler-access: public
      x-ostler-public-mode: open
      parameters:
        - name: kind
          in: query
          required: false
          schema: {$ref: "#/components/schemas/LayoutKind"}
      responses:
        "200":
          description: The layouts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LayoutList"}
        "400":
          $ref: "#/components/responses/Error"
  /ui/layouts/{vid}/{profile}/{class}/{kind}/{id}:
    parameters:
      - $ref: "#/components/parameters/LayoutVid"
      - $ref: "#/components/parameters/LayoutProfile"
      - $ref: "#/components/parameters/LayoutClass"
      - name: kind
        in: path
        required: true
        schema: {$ref: "#/components/schemas/LayoutKind"}
      - name: id
        in: path
        required: true
        description: The layout id (preset ids are `ostler.<name>`; user ids are minted by the shell).
        schema: {type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,63}$"}
    get:
      tags: [layouts]
      operationId: getLayout
      summary: The layout this profile sees and its source (`user`, `car`, `pack` or `generated`).
      x-ostler-access: public
      x-ostler-public-mode: open
      responses:
        "200":
          description: The resolved layout; `layout` is null for `generated` (the shell's own preset or generated default).
          headers:
            ETag:
              description: A hash of the layout (`"generated"` for the shell's own); send it back as `If-Match` on `PUT`.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LayoutResolved"}
        "400":
          $ref: "#/components/responses/Error"
    put:
      tags: [layouts]
      operationId: putLayout
      summary: Store this profile's copy (validated by openostler.layouts; Park to edit).
      description: >
        The body is a whole `ostler.layout/1` document (≤ 256 KB) whose `kind` and `id` are
        the route's, that holds the route's class and carries `base` (what it was made
        from, the Reset target). Refusals carry the validator's `errors` (each with `rule`,
        `message` and where: `class`, `face`, `slot`) and `warnings`. Only `drive_mode`
        layouts are stored until the rail, strip and Home guardrails land (DM3: 403
        `kind_not_writable`).
      x-ostler-access: public
      x-ostler-public-mode: refused
      parameters:
        - $ref: "#/components/parameters/LayoutClassHeader"
        - name: If-Match
          in: header
          required: false
          description: The ETag last read; a stale one answers 409 `etag_mismatch`.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/vnd.ostler.layout+json:
            schema: {$ref: "#/components/schemas/OstlerLayout"}
          application/json:
            schema: {$ref: "#/components/schemas/OstlerLayout"}
      responses:
        "200":
          description: Stored.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LayoutPutReply"}
        "202":
          description: Held until the car is Parked (a tablet or desktop editing a driver-facing class, R7).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LayoutHeld"}
        "400":
          description: "Refused (`layout_invalid` with `errors`, `layout_key`, `layout_class`, `base_missing`, `bad_request`)."
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/ErrorReply"}
                  - {$ref: "#/components/schemas/LayoutRefusal"}
        "403":
          $ref: "#/components/responses/LayoutForbidden"
        "409":
          $ref: "#/components/responses/ParkToEdit"
        "413":
          $ref: "#/components/responses/TooLarge"
    delete:
      tags: [layouts]
      operationId: deleteLayout
      summary: Revert to what lies beneath (the car's, the pack's or the generated default); the removed copy becomes the Before reset snapshot.
      x-ostler-access: public
      x-ostler-public-mode: refused
      parameters:
        - $ref: "#/components/parameters/LayoutClassHeader"
      responses:
        "200":
          description: Reverted (`deleted` is false when this profile had no copy).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LayoutDeleteReply"}
        "202":
          description: Held until the car is Parked (R7).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LayoutHeld"}
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ParkToEdit"
  /ui/layouts/{vid}/{profile}/{class}/reset:
    parameters:
      - $ref: "#/components/parameters/LayoutVid"
      - $ref: "#/components/parameters/LayoutProfile"
      - $ref: "#/components/parameters/LayoutClass"
    post:
      tags: [layouts]
      operationId: resetLayouts
      summary: Reset layout (§7.8) for this profile, vehicle and class; one kind (this surface) or everything. Keeps a Before reset snapshot for 7 days.
      x-ostler-access: public
      x-ostler-public-mode: refused
      parameters:
        - $ref: "#/components/parameters/LayoutClassHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: {$ref: "#/components/schemas/LayoutKind"}
      responses:
        "200":
          description: Reset (`reset` layouts removed).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LayoutResetReply"}
        "202":
          description: Held until the car is Parked (R7).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LayoutHeld"}
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ParkToEdit"
        "413":
          $ref: "#/components/responses/TooLarge"
  /ui/layouts/{vid}/{profile}/{class}/undo-reset:
    parameters:
      - $ref: "#/components/parameters/LayoutVid"
      - $ref: "#/components/parameters/LayoutProfile"
      - $ref: "#/components/parameters/LayoutClass"
    post:
      tags: [layouts]
      operationId: undoResetLayouts
      summary: Undo reset - restore the Before reset snapshot (within 7 days).
      x-ostler-access: public
      x-ostler-public-mode: refused
      parameters:
        - $ref: "#/components/parameters/LayoutClassHeader"
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LayoutUndoReply"}
        "202":
          description: Held until the car is Parked (R7).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LayoutHeld"}
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/ParkToEdit"
  /ui/drive-mode/{vid}/{profile}/{display}/{class}:
    parameters:
      - $ref: "#/components/parameters/LayoutVid"
      - $ref: "#/components/parameters/LayoutProfile"
      - name: display
        in: path
        required: true
        description: The display's id (the shell mints one per browser, or `?display_id=` names it).
        schema: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"}
      - $ref: "#/components/parameters/LayoutClass"
    get:
      tags: [layouts]
      operationId: getDriveMode
      summary: The selected Drive mode of one display (null when it has none yet).
      x-ostler-access: public
      x-ostler-public-mode: open
      responses:
        "200":
          description: The selection.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DriveSelectionReply"}
        "400":
          $ref: "#/components/responses/Error"
    put:
      tags: [layouts]
      operationId: putDriveMode
      summary: Select a Drive mode (allowed in every driving state, R1); reordering a stored rotation is an edit (Park to edit).
      x-ostler-access: public
      x-ostler-public-mode: refused
      parameters:
        - $ref: "#/components/parameters/LayoutClassHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DriveSelection"}
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DriveSelectionReply"}
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ParkToEdit"
        "413":
          $ref: "#/components/responses/TooLarge"
components:
  # Wire conventions for every Ostler API (HTTP here, SSE/MQTT in asyncapi.yaml). New
  # fields follow them; the existing deviations are listed so they can be migrated.
  x-ostler-wire-conventions:
    timestamps: >
      Wall-clock instants on the wire are RFC 3339 date-times in UTC with a `Z` suffix
      (`Rfc3339Utc`), optionally with fractional seconds. Durations and offsets inside a
      session are integer milliseconds from the session start (`SessionMs`). Epoch numbers
      appear only inside CSV columns.
      Exempt: durations and session offsets in milliseconds (`t`, `t_ms`, `start_ms`), CSV
      columns, and the acceleration samples `[epoch_ms, ax, ay, az]` of `POST
      /sessions/{id}/accel`.
    timestamp-deviations:
      - "Snapshot.ts (epoch seconds, EpochSeconds): deprecated for Snapshot.ts_utc; removed in 0.2.0."
      - "Recording.since (epoch seconds): deprecated for Recording.since_utc; removed in 0.2.0."
      - "ActiveTest.since (epoch seconds): deprecated for ActiveTest.since_utc; removed in 0.2.0."
      - "SessionData.utc (epoch ms per sample): deprecated for SessionData.t0_utc + t; removed in 0.2.0."
      - "The audio `start` query (epoch ms): deprecated for `start_utc`; removed in 0.2.0."
      - "Captures file rows (`t` in labeled_captures.jsonl) written before 0.1.0: local time without an offset (read as unknown; new rows are RFC 3339 UTC)."
    deprecation: >
      A deprecated field or parameter carries `deprecated: true` and `x-ostler-removed-in`;
      it stays for one minor release. Responses that still carry one (`/snapshot`,
      `/events`, `/sessions/{id}/data`) send `Deprecation: @<epoch>` (RFC 9745) and a
      `Link` with `rel="deprecation"` to the CHANGELOG.
    units: >
      Values are sent in the storage unit of their COVESA VSS metric (ADR-0016, VSS 6.1
      units file); the UI converts for display with Intl. Today's signal-store units
      (`u`, `unit`, `units`) are the pack's strings, migrating to VSS units at U0/U3.
    geo: >
      Positions are WGS 84 decimal degrees in GeoJSON (RFC 7946) order `[lon, lat]`.
      Traces are GeoJSON LineStrings (`GeoJsonLineString`); `SessionData.trace` is a
      LineString Feature whose `properties.t_ms` holds each position's session ms
      (`GeoJsonTrace`). The deprecated `SessionData.track` (`[lon, lat, t_ms]`, removed in
      0.2.0) is not GeoJSON: its third member is session time, not altitude.
    vehicle-id: >
      Every session carries `vid` (`Vid`), the vehicle it was recorded on; added by U0-A
      as an optional string and absent on older sessions.
    errors: >
      Every API error body is `{ok: false, error: <English sentence>, code?: <token>}`
      (`ErrorReply`) as `application/json`, with the HTTP status of the info table; a 2xx
      body never carries `ok: false`. Clients key on `code`, never on `error`.
    openness: >
      Response objects are open (`additionalProperties: true`): clients must ignore
      unknown fields, as the UI's Zod schemas do.

  headers:
    Deprecation:
      description: RFC 9745 — the response carries a deprecated field (since the given epoch seconds).
      schema: {type: string, pattern: "^@[0-9]+$"}
    DeprecationLink:
      description: 'RFC 8288 link to the deprecation notes: `<…/CHANGELOG.md>; rel="deprecation"`.'
      schema: {type: string}

  securitySchemes:
    adminBasic:
      type: http
      scheme: basic
      description: >
        The admin password (`--admin-password` or `D2DIAG_ADMIN_PW`); the user name is
        ignored. Unset → admin routes are ungated. Realm `Ostler admin`.

  pathItems:
    AppShell:
      get:
        tags: [app]
        summary: The single-page app (the legacy v2 page when no UI build is present).
        x-ostler-access: public
        x-ostler-public-mode: open
        responses:
          "200":
            $ref: "#/components/responses/Html"
    AdminShell:
      get:
        tags: [app]
        summary: The same app behind admin auth; the page shows the mapping tabs.
        x-ostler-access: admin
        x-ostler-public-mode: open
        security:
          - adminBasic: []
        responses:
          "200":
            $ref: "#/components/responses/Html"
          "401":
            $ref: "#/components/responses/UnauthorizedPage"
    LegacyV2:
      get:
        tags: [app]
        summary: The hand-written legacy v2 dashboard (reference, ADR-0004).
        x-ostler-access: admin
        x-ostler-public-mode: open
        security:
          - adminBasic: []
        responses:
          "200":
            $ref: "#/components/responses/Html"
          "401":
            $ref: "#/components/responses/UnauthorizedPage"
    LegacyV1:
      get:
        tags: [app]
        summary: The hand-written legacy v1 dashboard (reference, ADR-0004).
        x-ostler-access: admin
        x-ostler-public-mode: open
        security:
          - adminBasic: []
        responses:
          "200":
            $ref: "#/components/responses/Html"
          "401":
            $ref: "#/components/responses/UnauthorizedPage"

  parameters:
    Module:
      name: module
      in: query
      required: false
      description: A module id or legacy alias (canonicalised); absent → the pack's default module.
      schema: {type: string}
    SessionId:
      name: id
      in: path
      required: true
      description: A session id (`YYYYMMDDTHHMMSSZ[-N]`); anything else answers 404.
      schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,80}$"}
    NoteId:
      name: nid
      in: path
      required: true
      schema: {type: string, pattern: "^[0-9a-f]{8}$"}

    LayoutVid:
      name: vid
      in: path
      required: true
      description: The vehicle id, or `current` for this server's local vehicle.
      schema: {type: string, pattern: "^[0-9A-Za-z][0-9A-Za-z_-]{0,63}$"}
    LayoutProfile:
      name: profile
      in: path
      required: true
      description: "`car` (the head unit's kiosk session, the owner's default for this car) or a user id. Not authenticated until accounts land (accounts spec P1)."
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"}
    LayoutClass:
      name: class
      in: path
      required: true
      description: The layout class the layouts are for.
      schema: {$ref: "#/components/schemas/LayoutClassName"}
    LayoutClassHeader:
      name: Ostler-Layout-Class
      in: header
      required: false
      description: >
        The layout class of the display making the request (Park to edit, R1). While the
        car is not Parked or Idling (and the driving state is `unknown` until U2), a write
        from a driver-facing class (`hu5`, `hu7`, `hu9`, `huwide`, `phone`) answers 409
        `park_to_edit`; a missing or unknown value counts as driver-facing. `tablet` and
        `desktop` may write; a write of theirs for a driver-facing class is held until
        Parked (202).
      schema: {$ref: "#/components/schemas/LayoutClassName"}
  responses:
    Html:
      description: An HTML page.
      content:
        text/html:
          schema: {type: string}
    UnauthorizedPage:
      description: Admin auth required (an app page; empty body, so the browser shows its Basic Auth prompt).
      headers:
        WWW-Authenticate:
          schema: {type: string, const: 'Basic realm="Ostler admin"'}
    Unauthorized:
      description: "Admin auth required (`code: auth_required`)."
      headers:
        WWW-Authenticate:
          schema: {type: string, const: 'Basic realm="Ostler admin"'}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorReply"}
    Error:
      description: "`{ok: false, error, code?}`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorReply"}
    Forbidden:
      description: "Refused in public mode (`code: public_mode`, `not available in public mode`) or for a synthetic session (`code: read_only`, `synthetic sessions are read-only`)."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorReply"}
    NotRecording:
      description: "The session is not being recorded (`code: not_recording`; `Not recording — connect to the car first`, or `session <id> is not being recorded`)."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorReply"}
    Conflict:
      description: "A conflict with the server state (`code: not_recording`, `disconnected` or `conflict`)."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorReply"}
    CommunityOff:
      description: "Community is disabled on this server, or sharing is not enabled (`code: community_off`)."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorReply"}
    TooLarge:
      description: "The body is too large (`code: too_large`; 2 MiB per JSON body or audio chunk; 5000 accel samples)."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorReply"}
    ParkToEdit:
      description: "Park to edit (`code: park_to_edit`, with `driving_state` and the requesting `layout_class`), or a stale `If-Match` (`code: etag_mismatch`, with the current `etag`)."
      content:
        application/json:
          schema:
            allOf:
              - {$ref: "#/components/schemas/ErrorReply"}
              - type: object
                properties:
                  driving_state: {type: string, enum: [parked, idling, moving, unknown]}
                  layout_class: {type: [string, "null"]}
                  etag: {type: string}
    LayoutForbidden:
      description: "Refused in public mode (`code: public_mode`), or a `rail`, `strip` or `home` layout before its guardrail check (`code: kind_not_writable`)."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorReply"}

  schemas:
    # ---- conventions ----
    Rfc3339Utc:
      type: string
      format: date-time
      pattern: "Z$"
      description: An RFC 3339 date-time in UTC with the `Z` suffix, e.g. `2026-10-05T09:00:00.000Z`.
    EpochSeconds:
      type: number
      description: 'Deprecated: seconds since the Unix epoch. Every use is deprecated and goes in 0.2.0 (see x-ostler-wire-conventions.timestamp-deviations).'
    SessionMs:
      type: number
      minimum: 0
      description: Milliseconds since the session start.
    VssUnit:
      type: string
      description: A unit string; new metrics use the COVESA VSS 6.1 unit of their metric (ADR-0016). Empty for unitless values.
    Vid:
      type: [string, "null"]
      description: The vehicle a session belongs to (U0-A). Optional; absent or null on older sessions.
    GeoJsonPosition:
      type: array
      description: An RFC 7946 position `[lon, lat]` (WGS 84 degrees), optionally with altitude in metres.
      prefixItems:
        - {type: number, minimum: -180, maximum: 180}
        - {type: number, minimum: -90, maximum: 90}
        - {type: number}
      minItems: 2
      maxItems: 3
    GeoJsonLineString:
      type: object
      description: An RFC 7946 LineString, the convention for a standalone trace.
      required: [type, coordinates]
      properties:
        type: {const: LineString}
        coordinates:
          type: array
          minItems: 2
          items: {$ref: "#/components/schemas/GeoJsonPosition"}
        bbox:
          type: array
          items: {type: number}
    GeoJsonTrace:
      type: object
      description: >
        An RFC 7946 Feature with a LineString of `[lon, lat]` positions; `properties.t_ms`
        holds each position's session ms, in the same order (the togeojson `coordTimes`
        convention in session time: `t0_utc` + `t_ms` gives the instant).
      required: [type, geometry, properties]
      properties:
        type: {const: Feature}
        geometry:
          allOf:
            - $ref: "#/components/schemas/GeoJsonLineString"
            - type: object
              properties:
                coordinates:
                  type: array
                  items: {type: array, maxItems: 2}
        properties:
          type: object
          required: [t_ms]
          properties:
            t_ms: {type: array, items: {$ref: "#/components/schemas/SessionMs"}}
          additionalProperties: true
      additionalProperties: true
    NumberPair:
      type: [array, "null"]
      prefixItems: [{type: number}, {type: number}]
      minItems: 2
      maxItems: 2
    LonLat:
      type: [array, "null"]
      description: "`[lon, lat]` (GeoJSON order)."
      prefixItems: [{type: number}, {type: number}]
      minItems: 2
      maxItems: 2
    Confidence:
      type: string
      description: "`proven` or `candidate` (ADR-0006); open, a new level must not break clients."

    # ---- generic replies ----
    ErrorReply:
      type: object
      description: The error envelope of every API error (4xx/5xx).
      required: [ok, error]
      properties:
        ok: {const: false}
        error: {type: string, description: One English sentence for people; clients never parse it.}
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: >
            A stable token for programs: `bad_request`, `no_match`, `auth_required`,
            `public_mode`, `not_local`, `read_only`, `not_found`, `not_recording`, `disconnected`,
            `community_off`, `conflict`, `too_large`, `internal`, `car_refused`,
            `unavailable`, `car_timeout`; stored layouts add `park_to_edit`,
            `etag_mismatch`, `kind_not_writable`, `layout_invalid`, `layout_key`,
            `layout_class` and `base_missing`. Open: a client treats an unknown code by its
            HTTP status.
        nrc: {type: integer, description: "With `car_refused`: the ECU's negative response code (KWP2000 NRC)."}
      additionalProperties: true
    OkReply:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        error: {type: [string, "null"]}
        stored: {type: boolean}
        module: {type: string}
        name: {type: string}
        consent: {type: boolean}
        queued: {type: boolean}
      additionalProperties: true

    # ---- snapshot ----
    SignalValue:
      type: object
      description: >
        One live value: v value, u unit, s range status, c confidence. A node source
        (NodeSource spec §6.3, §6.4) adds where the value came from and how old it is; a
        cable source leaves those fields out.
      required: [v]
      properties:
        v: {type: [number, "null"]}
        u: {$ref: "#/components/schemas/VssUnit"}
        s: {type: [string, "null"], description: "ok | low | high | suspect | null"}
        c: {$ref: "#/components/schemas/Confidence"}
        m: {type: string, description: "Node source: the COVESA VSS path the value was published under."}
        m_unknown: {type: boolean, description: "Node source: `m` is not a known VSS or overlay path (kept, flagged)."}
        label: {type: string, description: "Node source: the field's enumeration label (e.g. `closed`)."}
        raw: {type: number, description: "Node source: the undecoded raw value (for decode work; not shown to drivers)."}
        ts_utc:
          description: "Node source: when the node read the value (null until the node's clock is set by SNTP)."
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/Rfc3339Utc"}
        age_s: {type: [number, "null"], description: "Node source: seconds since the node read it, on the node's own clock; null when unknown."}
        stale: {type: boolean, description: "Node source: true for a last known value (retained at subscribe time, past 3 × its interval, or before a node restart). Never shown as live."}
        src: {type: string, description: "Node source: `<device>/<source tag>`, e.g. `node/kline-diag/td5/21 09`."}
        before_restart: {type: boolean, description: "Node source: read before the node last restarted."}
      additionalProperties: true
    Logging:
      type: object
      required: [recording]
      properties:
        recording: {type: boolean}
        file: {type: string}
        rows: {type: number}
      additionalProperties: true
    PortInfo:
      type: object
      required: [spec, resolved]
      properties:
        spec: {type: string}
        resolved: {type: [string, "null"]}
        candidates: {type: array, items: {type: string}}
      additionalProperties: true
    ActiveTest:
      type: object
      required: [action, label, since, since_utc, stop]
      properties:
        action: {type: string}
        label: {type: string}
        since:
          allOf: [{$ref: "#/components/schemas/EpochSeconds"}]
          description: When the test was started. Use `since_utc`.
          deprecated: true
          x-ostler-removed-in: "0.2.0"
        since_utc: {$ref: "#/components/schemas/Rfc3339Utc"}
        stop: {type: string}
      additionalProperties: true
    GpsFix:
      type: object
      required: [fix, lat, lon, speed_kmh, heading, sats, hdop, src, age_s]
      properties:
        fix: {type: boolean}
        lat: {type: [number, "null"]}
        lon: {type: [number, "null"]}
        speed_kmh: {type: [number, "null"]}
        heading: {type: [number, "null"]}
        alt_m: {type: [number, "null"], description: "GNSS altitude in metres (Drive modes' altitude tile; error is tens of metres)."}
        sats: {type: [number, "null"]}
        hdop: {type: [number, "null"]}
        src: {type: string, description: "usb | mock | replay"}
        age_s: {type: [number, "null"]}
      additionalProperties: true
    Recording:
      type: object
      description: The session being recorded right now.
      required: [session, since, since_utc, rows]
      properties:
        session: {type: string}
        since:
          allOf: [{$ref: "#/components/schemas/EpochSeconds"}]
          description: When the session started. Use `since_utc`.
          deprecated: true
          x-ostler-removed-in: "0.2.0"
        since_utc: {$ref: "#/components/schemas/Rfc3339Utc"}
        rows: {type: number}
        state: {type: string, description: "recording | paused (absent = recording)"}
      additionalProperties: true
    SourceState:
      type: object
      required: [state]
      properties:
        state: {type: string, description: "available | unavailable | on"}
        reason: {type: [string, "null"]}
      additionalProperties: true
    RecordingSources:
      type: object
      required: [gps, pi_audio, imu, accel_hz]
      properties:
        gps: {type: string, description: "usb | mock | none"}
        pi_audio: {$ref: "#/components/schemas/SourceState"}
        imu: {$ref: "#/components/schemas/SourceState"}
        accel_hz: {type: number}
      additionalProperties: true
    Snapshot:
      type: object
      description: The live state, pushed over `/events` every poll and returned by `/snapshot`.
      required: [status]
      properties:
        status: {type: string, description: "connected | connecting | error | no-cable | needs-detect (a K-line source with no profile: nothing is sent until a Parked detect_protocol) | asleep (a node source: the node sleeps cleanly, or its power record says `off`) | broker-down (a node source: the Brain cannot reach the MQTT broker)"}
        source_kind: {type: string, description: "serial (a pack's cable source) | kline (the generic K-line link source) | node (NodeSource: the node's MQTT messages)"}
        node:
          description: A node source's node; absent for cable sources.
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/NodeState"}
        vss:
          type: object
          description: "A node source: every `Vehicle.*` path the nodes publish, with each source and the selected one (NodeSource spec §6.5)."
          additionalProperties: {$ref: "#/components/schemas/VssReading"}
        devices: {type: array, items: {type: string}, description: "A node source: every device seen under the vehicle id."}
        device_info:
          type: object
          description: "A node source: each device's firmware version and manifest `etag`, from its retained capability manifest (P3); devices with no manifest are absent."
          additionalProperties: {$ref: "#/components/schemas/DeviceInfo"}
        faults_note: {type: string, description: "Why `faults` is empty or incomplete (a node source: `not read by the node yet` when no device publishes a fault list for the module; the node's note when its read failed or is not implemented). Absent when the list was read."}
        faults_read:
          description: "A node source: the node's latest whole fault list for the module (module-bus spec v1.3 §6.2); null when not read."
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/NodeFaults"}
        source: {type: string}
        module: {type: string, description: A canonical module id (a /pack module id).}
        mode: {type: [string, "null"]}
        modes: {type: array, items: {type: string}}
        signals:
          type: object
          additionalProperties: {$ref: "#/components/schemas/SignalValue"}
        faults: {type: array, items: {type: string}}
        logging: {$ref: "#/components/schemas/Logging"}
        public: {type: boolean}
        fault_watch: {type: boolean}
        allow_shutdown: {type: boolean}
        error: {type: string}
        stale: {type: boolean}
        connect_phase: {type: [string, "null"]}
        conn:
          type: string
          description: "disconnected | connecting | connected | lost | reconnecting | error"
        ts:
          allOf: [{$ref: "#/components/schemas/EpochSeconds"}]
          description: When the snapshot was taken. Use `ts_utc`.
          deprecated: true
          x-ostler-removed-in: "0.2.0"
        ts_utc: {$ref: "#/components/schemas/Rfc3339Utc"}
        battery_v: {type: [number, "null"]}
        port: {$ref: "#/components/schemas/PortInfo"}
        active_test:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/ActiveTest"}
        gps:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/GpsFix"}
        recording:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/Recording"}
        recording_sources:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/RecordingSources"}
        link:
          description: The active source's K-line link; null when it has none to report.
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/KLineLink"}
      additionalProperties: true
    NodePower:
      type: object
      description: The node's ADR-0040 power record, as published on its `power` topic.
      required: [state]
      properties:
        state: {type: string, description: "off | asleep | waking | awake | held | shutting_down (ADR-0040 §1)"}
        since: {type: [string, "null"], description: "RFC 3339 UTC when the state began; null until the node's clock is set."}
        since_us: {type: integer, description: "The node's monotonic clock when the state began."}
        class: {type: string, description: "The parked reachability class (always | wakeable | check_in | none), the same as the manifest's `power.class` in every state."}
        wake_paths: {type: array, description: "The parked wake paths, the same as the manifest's."}
        next_checkin: {type: [string, "null"]}
        leases: {type: array}
        est_ma: {type: [number, "null"]}
        feeds:
          type: array
          description: "A feed owner's switched supplies (module-bus spec v1.3 §5): `{target, state: on | off, since}`; entries of another shape are dropped."
          items:
            type: object
            required: [target, state]
            properties:
              target: {type: string}
              state: {type: string, enum: ["on", "off"]}
              since: {type: [string, "null"]}
            additionalProperties: true
        reason: {type: string}
      additionalProperties: true
    NodeState:
      type: object
      description: The node that serves the active module (NodeSource spec §8, §10).
      required: [device, status, power, last_seen_utc, broker]
      properties:
        device: {type: [string, "null"], description: "The device id in the node's topics; null before any is seen."}
        status: {type: [string, "null"], description: "online | offline (its will) | asleep (a clean sleep, ADR-0037 Amendment 8) | null (never seen)"}
        feed:
          description: "The switched supply the device is on, from its feed owner's `power.feeds` (module-bus spec v1.3 §5); null when none reports one. An `offline` device whose feed is `off` reads as asleep (off), not as a loss."
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/NodeFeed"}
        power:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/NodePower"}
        boot: {type: [integer, "null"], description: "The node's boot counter (from its VSS payloads)."}
        fw: {type: [string, "null"], description: "The node's firmware version, from its manifest (P3); null until one is published."}
        etag: {type: [string, "null"], description: "The node's capability-manifest etag (P3); null until one is published."}
        last_seen_utc:
          description: When the Brain last received a live message from the device; null when it has only stored ones.
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/Rfc3339Utc"}
        broker:
          type: object
          required: [connected, host]
          properties:
            connected: {type: boolean}
            host: {type: string}
          additionalProperties: true
        tap:
          description: >
            The raw-tap subscription (NodeSource spec §7): null while no session records
            (the tap is subscribed only then, owner answer 9).
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/NodeTap"}
      additionalProperties: true
    NodeTap:
      type: object
      required: [session, state]
      properties:
        session: {type: [string, "null"], description: "The tap session (a ULID) of the latest batch; null before one."}
        state: {type: string, enum: [connecting, waiting, receiving], description: "connecting: the tap connection is not up; waiting: subscribed, no batch in the last 5 s; receiving."}
        batches: {type: integer, minimum: 0}
      additionalProperties: true
    DeviceInfo:
      type: object
      description: A device's firmware version and capability-manifest etag (NodeSource spec §7, P3).
      required: [fw, etag]
      properties:
        fw: {type: [string, "null"]}
        etag: {type: [string, "null"], description: "The manifest's own etag (the SHA-256 of its canonical JSON, set by the device); null when it publishes none."}
      additionalProperties: true
    NodeManifest:
      type: object
      description: >
        A device's capability manifest as published, retained, on
        `ostler/v1/<vid>/<device>/manifest` (UI spec §5.1 device entry, §3.8; app-model spec
        §13.1; `ostler-firmware` `docs/specs/sensor-detection.md` §7). Owned by the
        module-bus message spec once it lands; the fields the cluster view reads are listed.
      properties:
        schema: {type: integer}
        id: {type: string}
        kind: {type: string, description: "node | brain | module (a guardian and a sensor node are `node` with that variant)"}
        variant: {type: string, description: "diag-port | guardian | sensor | …"}
        model: {type: string}
        board: {type: string, description: "The compiled-in board profile (`host-sim` in the firmware's host tests)."}
        fw: {type: string}
        etag: {type: string}
        priority: {type: number, description: "The owner's priority from pairing (higher first, ADR-0037 §3); absent when none is set (the claim then carries `priority: null`)."}
        memory:
          type: object
          properties:
            psram_kb: {type: number, description: "PSRAM fitted; 0 when the board has none."}
          additionalProperties: true
        roles:
          type: array
          description: "Roles the device may hold (ADR-0037 §2, §3): `{role, scope?, max_clients?, priority?}`. The gate is not listed here: it is declared by `transmit` (the node publishes `roles: []`)."
          items:
            type: object
            required: [role]
            properties:
              role: {type: string, enum: [pbroker, time, plca, uplink]}
              scope: {type: string}
              max_clients: {type: integer, minimum: 1}
              priority: {type: number}
            additionalProperties: true
        transmit:
          type: array
          description: The car buses whose transmit gate the device holds by its wiring.
          items:
            type: object
            required: [bus_id]
            properties:
              bus_id: {type: string}
            additionalProperties: true
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              kind: {type: string}
              origin: {type: string, enum: [board, detected, harness, config]}
              status: {type: string, enum: [ok, absent, fault, no_signal, unverified, refused], description: "`unverified`: present but not yet confirmed (the node's K-line item until an init on the bus succeeds; sensor-detection §2). Shown as \"Not verified yet\", neither ok nor a fault."}
              bus: {type: string, description: "The bus id an interface item serves (the node's K-line item: `kline-diag`)."}
            additionalProperties: true
        links: {type: array, items: {type: object, additionalProperties: true}, description: "How the device is reached (USB, T1S segment, Ethernet, Wi-Fi, BLE): `{kind, via?, segment?}`; the node sends `[{kind: wifi}]`."}
        power:
          type: object
          description: "The device's parked reachability class and wake paths (ADR-0040 §1); every `power` record it publishes carries the same `class` and `wake_paths`, whatever its `state` (sensor-detection amendment of 2026-10-06)."
          properties:
            class: {type: string, enum: [always, wakeable, check_in, none]}
            wake_paths: {type: array, items: {type: string}}
            parked_ma: {type: number, description: "Optional; the node does not send it yet."}
          additionalProperties: true
        problems:
          type: array
          description: "Absent when there is none (so the `etag` returns to its earlier value when a problem clears)."
          items:
            type: object
            required: [item, code]
            properties:
              item: {type: string, description: The item's `id`.}
              code: {type: string, description: "`gate_conflict` (on the item that holds a transmit gate): another device claims the gate of the same bus (ADR-0037 §5), so this device transmits nothing on it until every other claim is released; others as sensor-detection §7."}
            additionalProperties: true
        actions:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              category: {type: string, description: "An ADR-0033 category, or `system` for a device-to-device power order (the `shutdown` act, module-bus spec v1.3 §11) that no role grants."}
              tier: {type: integer}
              runs_on: {type: string}
              needs_brain: {type: boolean}
              queueable: {type: boolean}
              expires_max_s: {type: number}
            additionalProperties: true
      additionalProperties: true
    RoleClaim:
      type: object
      description: >
        A role claim as published, retained, on `ostler/v1/<vid>/<device>/role/<role>[/<scope>]`
        (ADR-0037 §3); an empty payload releases it.
      required: [role, term]
      properties:
        role: {type: string, enum: [gate, pbroker, time, plca, uplink]}
        scope: {type: [string, "null"], description: "The bus id for `gate`, the T1S segment for `plca`."}
        term: {type: integer, minimum: 0, description: "Incremented by every takeover (ADR-0037 §5)."}
        priority: {type: [number, "null"]}
        since: {type: [string, "null"], description: RFC 3339 UTC when the device took the role.}
        reason: {type: [string, "null"]}
      additionalProperties: true
    ClusterClaim:
      type: object
      description: "One role claim in the cluster view, with why it is void (`flags`: offline, asleep, no_manifest, not_declared, not_eligible, mismatch) or loses (superseded, conflict)."
      required: [term, void, flags]
      properties:
        role: {type: string}
        scope: {type: [string, "null"]}
        device: {type: string}
        term: {type: integer}
        priority: {type: [number, "null"]}
        since: {type: [string, "null"]}
        reason: {type: [string, "null"]}
        void: {type: boolean}
        flags:
          type: array
          items: {type: string, enum: [offline, asleep, no_manifest, not_declared, not_eligible, mismatch, superseded, conflict]}
      additionalProperties: true
    ClusterDevice:
      type: object
      description: >
        One device row of the Network page; the same shape as a device page's peer view
        (app-model spec §12.2, §13.2).
      required: [id, status, power, last_seen_utc, claims]
      properties:
        id: {type: string}
        kind: {type: [string, "null"]}
        variant: {type: [string, "null"]}
        class: {type: [string, "null"], enum: [brain, node, guardian, module, null], description: "How the role rules see it (null without a manifest)."}
        model: {type: [string, "null"]}
        board: {type: [string, "null"]}
        fw: {type: [string, "null"]}
        etag: {type: [string, "null"]}
        manifest_utc:
          description: When the Brain received the manifest; null without one.
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/Rfc3339Utc"}
        links: {type: array, items: {type: object, additionalProperties: true}, description: "Reached via (the manifest's `links`)."}
        status: {type: [string, "null"], description: "online | offline | asleep | null (not seen)"}
        power:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/NodePower"}
        last_seen_utc:
          description: When the Brain last received a live message from the device; null when it has only stored ones.
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/Rfc3339Utc"}
        since: {type: [string, "null"], description: "`power.since`: when its power state began."}
        roles_declared: {type: array, items: {type: object, additionalProperties: true}}
        transmit: {type: array, items: {type: object, additionalProperties: true}}
        memory: {type: [object, "null"], additionalProperties: true}
        items: {type: array, items: {type: object, additionalProperties: true}}
        problems:
          type: array
          description: "The manifest's `problems` (`{item, code}`; sensor-detection §7), e.g. `gate_conflict`: another device claims this device's transmit gate, so it transmits nothing on that bus."
          items: {type: object, additionalProperties: true}
        claims: {type: array, items: {$ref: "#/components/schemas/ClusterClaim"}}
        feed:
          description: "The switched supply it is on, from its feed owner's `power.feeds` (module-bus spec v1.3 §5); null when none reports one."
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/NodeFeed"}
      additionalProperties: true
    ClusterRole:
      type: object
      description: One single-holder role and scope (ADR-0037 §2); `no_holder` reads "No holder" (or "No gate for this bus").
      required: [role, scope, holder, no_holder, conflict, candidates, claims, last_handover]
      properties:
        role: {type: string, enum: [gate, pbroker, time, plca, uplink]}
        scope: {type: [string, "null"]}
        title: {type: string}
        holder: {type: [string, "null"]}
        term: {type: [integer, "null"]}
        since: {type: [string, "null"]}
        reason: {type: [string, "null"]}
        conflict: {type: boolean, description: "Two live gate claims on one bus, or a device on it reports `gate_conflict` in its manifest: they refuse to transmit and the bus has no holder (ADR-0037 §5)."}
        no_holder: {type: boolean}
        hands_over: {type: boolean, description: "false for the transmit gate (tied to the wiring)."}
        candidates:
          type: array
          description: Devices whose manifest lists the role and that are eligible, in the role's order.
          items:
            type: object
            required: [device]
            properties:
              device: {type: string}
              class: {type: [string, "null"]}
              status: {type: [string, "null"]}
              power_state: {type: [string, "null"]}
            additionalProperties: true
        claims: {type: array, items: {$ref: "#/components/schemas/ClusterClaim"}}
        feed:
          description: "The switched supply it is on, from its feed owner's `power.feeds` (module-bus spec v1.3 §5); null when none reports one."
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/NodeFeed"}
        last_handover:
          description: "The last change of holder caused by a live message the Brain received (a claim, a release, the holder going offline or asleep; for a gate it is never a handover, only the bus losing or regaining its gate); never inferred from the stored copies a subscribe delivers. Null when none was seen."
          oneOf:
            - {type: "null"}
            - type: object
              required: [from, to, at_utc]
              properties:
                from: {type: [string, "null"]}
                to: {type: [string, "null"]}
                term: {type: [integer, "null"]}
                at_utc: {$ref: "#/components/schemas/Rfc3339Utc"}
                reason: {type: [string, "null"]}
              additionalProperties: true
      additionalProperties: true
    Cluster:
      type: object
      description: "`GET /cluster`: the cluster view (NodeSource spec §11; app-model `cluster.read`)."
      required: [vid, source_kind, built_utc, stale, devices, roles, alerts]
      properties:
        vid: {type: [string, "null"]}
        source_kind: {type: string}
        built_utc: {$ref: "#/components/schemas/Rfc3339Utc"}
        as_of_utc:
          description: When the Brain last received any message for the view; null before one.
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/Rfc3339Utc"}
        stale: {type: boolean, description: "The broker is not connected: the view is last known, read-only."}
        broker:
          oneOf:
            - {type: "null"}
            - type: object
              required: [connected, host]
              properties:
                connected: {type: boolean}
                host: {type: string}
              additionalProperties: true
        devices: {type: array, items: {$ref: "#/components/schemas/ClusterDevice"}}
        roles: {type: array, items: {$ref: "#/components/schemas/ClusterRole"}}
        alerts:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: {type: string, enum: [gate_conflict, void_claim]}
              by:
                type: string
                enum: [claims, manifest, bus]
                description: "`gate_conflict` only: `claims` when two live gate claims meet on one bus (ADR-0037 §5); `manifest` when a device reports `gate_conflict` in its manifest's `problems` (it saw another claim on its gate, void ones included, and transmits nothing on that bus); `bus` when its `problems` entry carries `by: bus`: it saw traffic it did not send on the wire (module-bus spec v1.3 §7.2), released by the owner's acknowledgement or a quiet period, not by Remove device."
              role: {type: string}
              scope: {type: [string, "null"]}
              devices: {type: array, items: {type: string}}
              claimants: {type: array, items: {type: string}, description: "`by: manifest`: the other devices with a claim (void or not) on that gate."}
              flags: {type: array, items: {type: string}}
              message: {type: string}
            additionalProperties: true
        note: {type: string, description: Why the lists are empty (no node source).}
      additionalProperties: true
    NodeEvent:
      type: object
      description: >
        One device event (module-bus spec v1.3 §6.1) as the Brain received it: the event's
        own fields plus `seq` (the Brain's arrival number), `device` (from the topic) and
        `received_utc`. `severity` is null when the device sent a value outside the enum.
      required: [seq, device, id, name, severity, received_utc]
      properties:
        seq: {type: integer, minimum: 1}
        device: {type: string}
        id: {type: string, description: "The event's ULID (de-duplication key)."}
        name: {type: string, description: "Dotted, lower case: `alarm.triggered`, `gate.conflict`, `fault.new`."}
        class: {type: [string, "null"]}
        severity: {type: [string, "null"], enum: [info, warning, alarm, null]}
        ts: {type: [string, "null"], description: "RFC 3339 UTC on the device; null until its clock is set."}
        t_us: {type: [integer, "null"]}
        boot: {type: [integer, "null"]}
        source: {type: [string, "null"]}
        cause: {type: [string, "null"]}
        text: {type: [string, "null"]}
        received_utc: {$ref: "#/components/schemas/Rfc3339Utc"}
        retained: {type: boolean, description: "Delivered as a stored message (events are never retained; a misbehaving publisher)."}
      additionalProperties: true
    NodeEvents:
      type: object
      description: "`GET /cluster/events`."
      required: [vid, events, last_seq]
      properties:
        vid: {type: [string, "null"]}
        events: {type: array, items: {$ref: "#/components/schemas/NodeEvent"}}
        last_seq: {type: integer, minimum: 0}
        duplicates: {type: integer, minimum: 0, description: "Copies dropped by `id` (QoS 1 redelivery, bridge echoes)."}
        stale: {type: boolean}
        note: {type: string}
      additionalProperties: true
    NodeFaults:
      type: object
      description: >
        A node's latest whole fault list for the active module (module-bus spec v1.3 §6.2,
        `faults/<pack>.<module>`, retained). `status: ok` with no faults means read, none.
      required: [device, status, faults]
      properties:
        device: {type: string}
        topic_module: {type: string, description: "`<pack>.<module>` from the topic."}
        status: {type: string, enum: [ok, faults, error, unimplemented]}
        faults:
          type: array
          items:
            type: object
            required: [code, c]
            properties:
              code: {type: string}
              text: {type: string}
              state: {type: string}
              c: {$ref: "#/components/schemas/Confidence"}
            additionalProperties: true
        note: {type: [string, "null"]}
        read_utc:
          description: "The node's `ts` of the read; null until its clock is set."
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/Rfc3339Utc"}
        source: {type: [string, "null"]}
        last_known: {type: boolean, description: "A stored copy from before the Brain subscribed (no newer read seen live)."}
        before_restart: {type: boolean}
      additionalProperties: true
    NodeFeed:
      type: object
      description: "The switched supply a device is on, as its feed owner reports it in its own `power.feeds` (module-bus spec v1.3 §5)."
      required: [owner, state]
      properties:
        owner: {type: string}
        state: {type: string, enum: ["on", "off"]}
        since: {type: [string, "null"]}
      additionalProperties: true
    RemoveDeviceReply:
      type: object
      description: "`POST /cluster/remove`: what Remove device did."
      required: [ok, vid, device, topics, purged, refused, remaining, buses, revoked]
      properties:
        ok: {type: boolean}
        vid: {type: string}
        device: {type: string}
        topics: {type: array, items: {type: string}, description: Every retained topic purged or tried.}
        purged: {type: array, items: {type: string}}
        refused: {type: array, items: {type: string}, description: Topics the broker refused to clear (its ACL).}
        remaining: {type: array, items: {type: string}, description: Retained topics still there after the purge.}
        buses: {type: array, items: {type: string}, description: The gate buses its claims held.}
        revoked:
          type: object
          properties:
            brain: {type: boolean}
            broker: {type: string, description: "The install's revoke hook result, or `not configured`."}
          additionalProperties: true
        error: {type: string}
      additionalProperties: true
    VssReading:
      type: object
      description: One VSS path from the nodes; the selected source's value at the top level.
      required: [sel, value, unit, stale, sources]
      properties:
        sel: {type: string, description: The selected source (`<device>/<source tag>`).}
        value: {type: [number, "null"]}
        unit: {$ref: "#/components/schemas/VssUnit"}
        ts_utc:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/Rfc3339Utc"}
        age_s: {type: [number, "null"]}
        stale: {type: boolean}
        c: {$ref: "#/components/schemas/Confidence"}
        sources:
          type: object
          additionalProperties:
            type: object
            properties:
              v: {type: [number, "null"]}
              u: {type: string}
              ts_utc:
                oneOf:
                  - {type: "null"}
                  - {$ref: "#/components/schemas/Rfc3339Utc"}
              age_s: {type: [number, "null"]}
              stale: {type: boolean}
              c: {$ref: "#/components/schemas/Confidence"}
              primary: {const: true, description: "The pack's primary field for this path (module-bus spec v1.3 §6); a usable primary is selected before other sources."}
            additionalProperties: true
      additionalProperties: true
    KLineLink:
      type: object
      description: >
        A K-line link (spec K-line profiles §6): the profile in use, how it was found and
        the ECU's key bytes. Never carries a VIN.
      required: [bus, profile, protocol, init, origin, address, key_bytes, timing, since]
      properties:
        bus: {type: string, enum: [kline]}
        profile: {type: string, description: "A built-in (iso9141_2, kwp2000_slow, kwp2000_fast) or a pack module's profile name."}
        protocol: {type: string, enum: [kwp2000, iso9141_2]}
        init: {type: string, enum: [fast, 5baud, none]}
        origin: {type: string, enum: [pack, detected, remembered, override]}
        address: {type: string, pattern: "^0x[0-9a-f]{2}$"}
        key_bytes: {type: [string, "null"], description: "The init key bytes, e.g. \"E9 8F\"."}
        timing: {type: [string, "null"], enum: [normal, extended, null]}
        since:
          type: [number, "null"]
          description: Epoch seconds the link came up.
      additionalProperties: false

    # ---- commands ----
    CommandRequest:
      type: object
      required: [action]
      properties:
        action: {type: string}
        params: {type: object, additionalProperties: true}
      additionalProperties: true
    FaultScanEntry:
      type: object
      required: [module, status]
      properties:
        module: {type: string}
        status: {type: string, description: "ok | faults | error | unimplemented"}
        faults: {type: array, items: {type: string}}
        error: {type: string}
        note: {type: string}
      additionalProperties: true
    CommandReply:
      type: object
      description: "`{ok, message|error}` plus action-specific extras."
      required: [ok]
      properties:
        ok: {type: boolean}
        message: {type: string}
        error: {type: string}
        file: {type: string}
        path: {type: string}
        rows: {type: number}
        fault_watch: {type: boolean}
        mode: {type: [string, "null"]}
        module: {type: string}
        raws:
          type: object
          additionalProperties: {type: string}
        report:
          type: array
          items: {$ref: "#/components/schemas/FaultScanEntry"}
        shutting_down: {type: boolean}
        options: {type: object, additionalProperties: true}
        outcome:
          type: string
          enum: [ok, bus-busy, ecu-refused, init-failed, no-ecu]
          description: "`detect_protocol`: how detection ended."
        link:
          description: "`detect_protocol`: the detected K-line link."
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/KLineLink"}
        scan:
          type: array
          description: "`module_scan`: one row per probed address."
          items: {$ref: "#/components/schemas/ModuleScanRow"}
      additionalProperties: true
    ModuleScanRow:
      type: object
      required: [address, init, module, status]
      properties:
        address: {type: string, description: "\"0x29\""}
        init: {type: string, enum: [fast, slow]}
        module: {type: string, description: "The pack's name for the address, or unknown:0xNN."}
        status: {type: string, enum: [responded, silent]}
        keybytes: {type: string}
        error: {type: string}
      additionalProperties: true

    # ---- metadata ----
    Field:
      type: object
      required: [name, unit, c, limits, label, group, description, derived, span, normal]
      properties:
        name: {type: string}
        unit: {$ref: "#/components/schemas/VssUnit"}
        c: {$ref: "#/components/schemas/Confidence"}
        limits: {$ref: "#/components/schemas/NumberPair"}
        label: {type: string}
        group: {type: string}
        description: {type: string}
        derived: {type: boolean}
        span: {$ref: "#/components/schemas/NumberPair"}
        normal: {$ref: "#/components/schemas/NumberPair"}
        metric: {type: [string, "null"], description: "The COVESA VSS path the field publishes (ADR-0016), null when unmapped; Drive modes bind to it."}
      additionalProperties: true
    FieldsResponse:
      type: object
      required: [module, fields]
      properties:
        module: {type: string}
        fields: {type: array, items: {$ref: "#/components/schemas/Field"}}
      additionalProperties: true
    FaultMeaning:
      type: object
      required: [key, name]
      properties:
        key: {type: string}
        name: {type: string}
        description: {type: string}
        cause: {type: string}
        severity: {type: string}
        system: {type: string}
        pcode: {type: string}
        source: {type: string}
      additionalProperties: true
    FaultsResponse:
      type: object
      required: [module, faults]
      properties:
        module: {type: string}
        faults: {type: array, items: {$ref: "#/components/schemas/FaultMeaning"}}
      additionalProperties: true
    SignalsResponse:
      type: object
      required: [module, signals]
      properties:
        module: {type: string}
        signals:
          type: array
          items: {type: object, additionalProperties: true}
      additionalProperties: true
    MapItem:
      type: object
      required: [name, status]
      properties:
        name: {type: string}
        status: {type: string, description: "ok | maybe | todo"}
        ref: {type: string}
        lid: {type: string}
        sig: {type: string}
      additionalProperties: true
    MapCoverage:
      type: object
      required: [ok, maybe, total]
      properties:
        ok: {type: number}
        maybe: {type: number}
        total: {type: number}
      additionalProperties: true
    MapResponse:
      type: object
      required: [module, map, modules, coverage]
      properties:
        module: {type: string}
        map:
          type: array
          items:
            type: object
            required: [cat, items]
            properties:
              cat: {type: string}
              items: {type: array, items: {$ref: "#/components/schemas/MapItem"}}
            additionalProperties: true
        modules: {type: array, items: {type: string}}
        coverage:
          type: object
          additionalProperties: {$ref: "#/components/schemas/MapCoverage"}
      additionalProperties: true
    CatalogCoverage:
      type: object
      required: [verified, candidate, sniff, untranscribed, total]
      properties:
        verified: {type: number}
        candidate: {type: number}
        sniff: {type: number}
        untranscribed: {type: number}
        total: {type: number}
      additionalProperties: true
    CatalogAction:
      type: object
      required: [action, label, status, safety, confirm]
      properties:
        action: {type: string}
        label: {type: string}
        status: {type: string, description: "verified | experimental | planned"}
        safety: {type: string, description: "read | actuator | service | gated"}
        confirm: {type: string, description: "none | preconditions | typed"}
        preconditions: {type: array, items: {type: string}}
        stop: {type: string}
        ref: {type: string}
      additionalProperties: true
    CatalogItem:
      type: object
      required: [id, name, status, safety]
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string, description: "verified | candidate | sniff | untranscribed"}
        safety: {type: string}
        sig: {type: [string, "null"]}
        lid: {type: [string, "null"]}
        ref: {type: string}
        note: {type: string}
        placeholder: {type: boolean}
        pages: {type: [number, "null"]}
        actions: {type: array, items: {$ref: "#/components/schemas/CatalogAction"}}
      additionalProperties: true
    CatalogGroup:
      type: object
      required: [id, title, items]
      properties:
        id: {type: string}
        title: {type: string}
        parent: {type: [string, "null"]}
        nanocom: {type: [string, "null"]}
        items: {type: array, items: {$ref: "#/components/schemas/CatalogItem"}}
      additionalProperties: true
    CatalogPage:
      type: object
      required: [id, title, coverage, groups]
      properties:
        id: {type: string, description: "faults | inputs | outputs | settings | utilities"}
        title: {type: string}
        coverage: {$ref: "#/components/schemas/CatalogCoverage"}
        groups: {type: array, items: {$ref: "#/components/schemas/CatalogGroup"}}
      additionalProperties: true
    Catalog:
      type: object
      required: [module, store_module, coverage, pages]
      properties:
        module: {type: string}
        store_module: {type: string}
        coverage: {$ref: "#/components/schemas/CatalogCoverage"}
        pages: {type: array, items: {$ref: "#/components/schemas/CatalogPage"}}
      additionalProperties: true
    CatalogModules:
      type: object
      required: [modules]
      properties:
        modules:
          type: array
          items:
            type: object
            required: [module, store_module, name, coverage]
            properties:
              module: {type: string}
              store_module: {type: string}
              name: {type: string}
              coverage: {$ref: "#/components/schemas/CatalogCoverage"}
            additionalProperties: true
      additionalProperties: true
    Pack:
      type: object
      description: The vehicle pack manifest (ADR-0013). Module ids are canonical; `aliases` maps legacy ids onto them.
      required: [id, name, api_version, default_module, modules, aliases]
      properties:
        id: {type: string}
        name: {type: string}
        api_version: {type: integer}
        default_module: {type: string}
        modules:
          type: array
          items:
            type: object
            required: [id, name, aliases, live]
            properties:
              id: {type: string}
              name: {type: string}
              aliases: {type: array, items: {type: string}}
              live: {type: boolean}
            additionalProperties: true
        aliases:
          type: object
          additionalProperties: {type: string}
        metrics:
          type: object
          description: The VSS paths the vehicle provides, each with the modules whose fields publish it (a Drive mode tells "Not in this session" from "Not available on this car" with it).
          additionalProperties: {type: array, items: {type: string}}
        layout:
          type: object
          description: The pack's screen layout; every part is optional so a minimal pack works.
          properties:
            driver_side: {type: string, enum: [left, right], description: "The driver's side; the rail goes on it (UI spec §3.3). Absent means left."}
            group_order: {type: array, items: {type: string}}
            drive: {type: object, additionalProperties: {type: object, additionalProperties: true}}
            body: {type: object, additionalProperties: true}
            util_lids: {type: object, additionalProperties: true}
            notices: {type: object, additionalProperties: true}
            replay: {type: object, additionalProperties: true}
          additionalProperties: true
      additionalProperties: true
    VersionPart:
      type: object
      required: [name, version, commit, source]
      properties:
        name: {type: string}
        version: {type: [string, "null"]}
        commit: {type: [string, "null"]}
        source: {type: [string, "null"]}
      additionalProperties: true
    VersionInfo:
      type: object
      required: [platform, pack, built, started]
      properties:
        platform: {$ref: "#/components/schemas/VersionPart"}
        pack:
          allOf:
            - $ref: "#/components/schemas/VersionPart"
            - type: object
              required: [id]
              properties:
                id: {type: string}
        built: {type: [string, "null"]}
        started: {$ref: "#/components/schemas/Rfc3339Utc"}
      additionalProperties: true

    # ---- mapping ----
    SniffResponse:
      type: object
      required: [module, modules, lids]
      properties:
        module: {type: [string, "null"]}
        modules: {type: array, items: {type: string}}
        lids:
          type: array
          items:
            type: object
            required: [lid, raw, count]
            properties:
              lid: {type: string}
              raw: {type: string}
              count: {type: number}
              decode:
                type: array
                items:
                  type: object
                  required: [name, value]
                  properties:
                    name: {type: string}
                    value: {type: [number, string, "null"]}
                    unit: {type: string}
                    offset: {type: number}
                    kind: {type: string}
                  additionalProperties: true
            additionalProperties: true
        status: {type: string, description: "starting | live | empty | error; absent = no sniffer"}
        error: {type: [string, "null"]}
        source: {type: string}
        frames: {type: number}
        lines: {type: number}
        age: {type: [number, "null"]}
      additionalProperties: true
    CalibRequest:
      type: object
      properties:
        samples:
          type: array
          description: "`[raw, displayed]` pairs; at least two with different raw values."
          items:
            type: array
            prefixItems: [{type: number}, {type: number}]
            minItems: 2
        lid: {type: [integer, string], description: An integer or a hex string.}
        offset: {type: integer}
        kind: {type: string, default: u16}
        name: {type: string}
        unit: {type: string}
      additionalProperties: true
    CalibReply:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        error: {type: string}
        signal: {type: string, description: A suggested `Signal(...)` line.}
        scale: {type: number}
        bias: {type: number}
        r2: {type: number}
        n: {type: number}
      additionalProperties: true
    AutomapRequest:
      type: object
      properties:
        samples:
          type: array
          items:
            type: object
            required: [text, raws]
            properties:
              text: {type: string, description: The reading shown by a reference tool.}
              raws:
                type: object
                description: LID (hex) → raw reply bytes (hex).
                additionalProperties: {type: string}
            additionalProperties: true
        candidate_lids: {type: array, items: {type: string}}
        name: {type: string}
        unit: {type: string}
      additionalProperties: true
    AutomapReply:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        error: {type: string}
        mode: {type: string, description: "numeric | state"}
        lid: {type: string}
        offset: {type: number}
        kind: {type: string}
        scale: {type: number}
        bias: {type: number}
        r2: {type: number}
        clean: {type: boolean}
        how: {type: string}
        signal: {type: string}
        bit: {type: [number, "null"]}
        rule: {type: string}
        mapping:
          type: object
          additionalProperties: {type: number}
        diff:
          type: array
          items:
            type: object
            required: [lid, byte, values]
            properties:
              lid: {type: string}
              byte: {type: number}
              values: {type: array, items: {type: number}}
            additionalProperties: true
      additionalProperties: true
    CaptureRequest:
      type: object
      properties:
        module: {type: string}
        lid: {type: string}
        raw: {type: string}
        text: {type: string, description: The value as read (also accepted as `value`).}
        value: {type: string}
      additionalProperties: true
    CaptureValue:
      type: object
      required: [module, lid, raw, value]
      properties:
        module: {type: string}
        lid: {type: string}
        raw: {type: string}
        value: {type: string}
      additionalProperties: true
    CaptureList:
      type: object
      required: [captures]
      properties:
        captures:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CaptureValue"
              - type: object
                properties:
                  t: {type: [number, "null"], description: "Session ms for a capture note."}
                  session: {type: [string, "null"]}
      additionalProperties: true
    SignalUpsertRequest:
      type: object
      required: [module, record]
      properties:
        module: {type: string, description: A module the pack lets the mapper write.}
        record:
          type: object
          required: [name, lid, offset]
          properties:
            name: {type: string}
            lid: {type: [string, integer]}
            offset: {type: integer}
          additionalProperties: true
      additionalProperties: true

    # ---- docs / community ----
    DocsResponse:
      type: object
      required: [docs]
      properties:
        docs:
          type: array
          items:
            type: object
            required: [id, title, group]
            properties:
              id: {type: string}
              title: {type: string}
              group: {type: string}
            additionalProperties: true
      additionalProperties: true
    Community:
      type: object
      required: [consent, endpoint]
      properties:
        consent: {type: [boolean, "null"]}
        endpoint: {type: [string, "null"]}
        vehicle: {type: [object, "null"], additionalProperties: true}
        install: {type: string}
        registered: {type: boolean}
        pending: {type: number}
      additionalProperties: true

    # ---- logbook ----
    SessionChannel:
      type: object
      required: [name]
      properties:
        name: {type: string}
        units: {$ref: "#/components/schemas/VssUnit"}
        group: {type: string}
        c: {type: [string, "null"], description: Store confidence; null for GPS and accel channels.}
        limits: {$ref: "#/components/schemas/NumberPair"}
      additionalProperties: true
    Place:
      type: object
      required: [label, source]
      properties:
        label: {type: string}
        source: {type: string, description: "geonames | osm"}
        label_offline: {type: [string, "null"]}
      additionalProperties: true
    NullablePlace:
      oneOf:
        - {type: "null"}
        - {$ref: "#/components/schemas/Place"}
    AudioTrack:
      type: object
      required: [track, mime, start_ms, source]
      properties:
        track: {type: string}
        mime: {type: string}
        start_ms: {type: number, description: Epoch milliseconds.}
        end_ms: {type: [number, "null"]}
        source: {type: string, description: "phone | pi"}
        bytes: {type: number}
      additionalProperties: true
    AccelCal:
      type: object
      required: [matrix, source, method]
      properties:
        matrix:
          type: array
          description: 3×3, sensor frame → vehicle frame.
          items: {type: array, items: {type: number}}
        source: {type: string, description: "phone | imu"}
        method: {type: string, description: "level | level+gps | manual"}
      additionalProperties: true
    SessionMeta:
      type: object
      required: [id, start_utc, end_utc, duration_s, rows, has_gps, distance_km, max_speed_kmh,
                 bbox, start_pos, end_pos, synthetic, recording, source]
      properties:
        id: {type: string}
        vid: {$ref: "#/components/schemas/Vid"}
        name: {type: [string, "null"]}
        description: {type: [string, "null"]}
        place: {$ref: "#/components/schemas/NullablePlace"}
        place_start: {$ref: "#/components/schemas/NullablePlace"}
        place_end: {$ref: "#/components/schemas/NullablePlace"}
        note_count: {type: number}
        start_utc: {$ref: "#/components/schemas/Rfc3339Utc"}
        end_utc:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/Rfc3339Utc"}
        duration_s: {type: number}
        rows: {type: number}
        parts: {type: array, items: {type: string}}
        modules: {type: array, items: {type: string}}
        channels: {type: array, items: {$ref: "#/components/schemas/SessionChannel"}}
        has_gps: {type: boolean}
        distance_km: {type: number}
        max_speed_kmh: {type: [number, "null"]}
        bbox:
          type: [array, "null"]
          description: "RFC 7946 bbox `[west, south, east, north]`."
          items: {type: number}
          minItems: 4
          maxItems: 4
        start_pos: {$ref: "#/components/schemas/LonLat"}
        end_pos: {$ref: "#/components/schemas/LonLat"}
        synthetic: {type: boolean}
        recording: {type: boolean}
        source: {type: string, description: "mock | live | node | demo"}
        devices: {type: array, items: {type: string}, description: "A node session: the device ids seen."}
        device_info:
          type: object
          description: "A node session: each device's firmware and manifest `etag` (the latest seen; a change is a `node_manifest` event)."
          additionalProperties: {$ref: "#/components/schemas/DeviceInfo"}
        pack:
          description: "A node session: the vehicle pack that decoded it on the Brain."
          oneOf:
            - {type: "null"}
            - type: object
              required: [id]
              properties:
                id: {type: string}
                version: {type: [string, "null"]}
              additionalProperties: true
        tap:
          type: array
          description: "A node session: its raw-tap files (`tap/<tap session>.otap`); `?fmt=pcapng` exports them."
          items: {$ref: "#/components/schemas/SessionTap"}
        end_reason:
          description: "A node session: why it ended (null while recording)."
          oneOf:
            - {type: "null"}
            - {type: string, enum: [idle, node_asleep, closed, split]}
        audio: {type: array, items: {$ref: "#/components/schemas/AudioTrack"}}
        accel_cal:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/AccelCal"}
      additionalProperties: true
    SessionTap:
      type: object
      description: "One raw-tap file of a node session (schemas/session-meta.schema.json `tap`)."
      required: [session, device, file, scrub, seq_first, seq_last, gaps, overflow]
      properties:
        session: {type: string, description: The node's tap session (a ULID).}
        device: {type: string}
        file: {type: string}
        boot_id: {type: [integer, "null"]}
        scrub: {type: [string, "null"], description: "on | brain | off | unknown (ADR-0036)"}
        buses: {type: array, items: {type: object}}
        clock: {type: [object, "null"]}
        started: {type: [string, "null"]}
        seq_first: {type: [integer, "null"]}
        seq_last: {type: [integer, "null"]}
        records: {type: integer}
        bytes: {type: integer}
        gaps: {type: integer}
        lost: {type: integer}
        overflow: {type: integer}
        time_marks: {type: integer, description: "The node's `time` events stored (raw-tap §2.4): with at least one the pcapng export stamps UTC; none keeps the node's clock since boot."}
        refused: {type: integer, description: "Batches refused whole for another MQTT 5 content type than `application/vnd.ostler.tap.v1` (module-bus spec §8); their records read as a gap."}
        unlabelled: {type: integer, description: "Batches without a content type or a readable `first_seq` (a node from before the firmware set them), read as v1 by their records."}
        first_seq_mismatch: {type: integer, description: "Batches whose `first_seq` disagreed with their first record's `seq` (logged; the records' `seq` is kept)."}
        brain_scrubbed: {type: integer}
        brain_dropped: {type: integer}
      additionalProperties: true
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions: {type: array, items: {$ref: "#/components/schemas/SessionMeta"}}
        next: {type: [string, "null"], description: "Pass back as `before` for the next page; null on the last page."}
      additionalProperties: true
    SessionHistogram:
      type: object
      required: [group, buckets]
      properties:
        group: {type: string, enum: [month, day]}
        buckets:
          type: array
          items:
            type: object
            required: [key, count, km]
            properties:
              key: {type: string, description: "`YYYY-MM` or `YYYY-MM-DD`."}
              count: {type: number}
              km: {type: number}
            additionalProperties: true
      additionalProperties: true
    SessionPatch:
      type: object
      properties:
        name: {type: [string, "null"], maxLength: 80}
        description: {type: [string, "null"], maxLength: 2000}
      minProperties: 1
      additionalProperties: true
    SessionMetaReply:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        error: {type: string}
        meta: {$ref: "#/components/schemas/SessionMeta"}
      additionalProperties: true
    SessionData:
      type: object
      description: "Columnar replay data: `t` is session ms; `ch[name][i]` aligns with `t[i]`."
      required: [id, t, utc, t0_utc, ch, track, trace, decimated]
      properties:
        id: {type: string}
        t: {type: array, items: {$ref: "#/components/schemas/SessionMs"}}
        utc:
          type: array
          description: Epoch milliseconds per row (null when unknown). Use `t0_utc` + `t`.
          items: {type: [number, "null"]}
          deprecated: true
          x-ostler-removed-in: "0.2.0"
        t0_utc:
          description: The wall-clock instant of session ms 0, from the first sample with a UTC time; null without one.
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/Rfc3339Utc"}
        ch:
          type: object
          additionalProperties: {type: array, items: {type: [number, "null"]}}
        text:
          type: object
          description: Text channels aligned with `t` (faults joined with "; ", module).
          additionalProperties: {type: array, items: {type: [string, "null"]}}
        track:
          type: array
          description: "`[lon, lat, t_ms]` per GPS point (GeoJSON coordinate order; the third member is session ms). Use `trace`."
          items:
            type: array
            prefixItems: [{type: number}, {type: number}, {type: number}]
            minItems: 3
            maxItems: 3
          deprecated: true
          x-ostler-removed-in: "0.2.0"
        trace:
          description: The GPS track as a GeoJSON LineString Feature (the same reduced points as `track`); null below two positions.
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/GeoJsonTrace"}
        decimated: {type: boolean}
      additionalProperties: true
    SessionEvent:
      type: object
      description: "One line of events.jsonl: `{t (session ms), type, ...}`. Open: unknown types are kept."
      required: [t, type]
      properties:
        t: {$ref: "#/components/schemas/SessionMs"}
        type: {type: string, description: "state | module | command | active_test | note | accel_cal | …"}
      additionalProperties: true
    SessionEvents:
      type: object
      required: [id, events]
      properties:
        id: {type: string}
        events: {type: array, items: {$ref: "#/components/schemas/SessionEvent"}}
      additionalProperties: true

    # ---- replay ----
    Note:
      type: object
      required: [id, t, kind, source, created]
      properties:
        id: {type: string, pattern: "^[0-9a-f]{8}$"}
        t: {$ref: "#/components/schemas/SessionMs"}
        t_end: {type: [number, "null"]}
        text: {type: string}
        tags: {type: array, items: {type: string}}
        kind: {type: string, enum: [mark, note, capture]}
        source: {type: string, enum: [live, retro]}
        created: {$ref: "#/components/schemas/Rfc3339Utc"}
        edited:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/Rfc3339Utc"}
        capture:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/CaptureValue"}
      additionalProperties: true
    NoteList:
      type: object
      required: [id, notes]
      properties:
        id: {type: string}
        notes: {type: array, items: {$ref: "#/components/schemas/Note"}}
      additionalProperties: true
    NoteCreate:
      type: object
      required: [t]
      properties:
        t: {type: number, minimum: 0, description: Session ms (rounded).}
        t_end: {type: [number, "null"], minimum: 0}
        text: {type: [string, "null"], maxLength: 2000}
        tags: {type: array, items: {type: string, maxLength: 40}, maxItems: 16}
        kind: {type: string, enum: [mark, note, capture], default: note}
        source: {type: string, enum: [live, retro], default: retro}
        capture: {$ref: "#/components/schemas/CaptureValue"}
      additionalProperties: true
    NotePatch:
      type: object
      properties:
        t: {type: number, minimum: 0}
        t_end: {type: [number, "null"], minimum: 0}
        text: {type: [string, "null"]}
        tags: {type: array, items: {type: string}}
      minProperties: 1
      additionalProperties: true
    LiveNote:
      type: object
      properties:
        kind: {type: string, enum: [mark, note, capture], default: mark}
        text: {type: [string, "null"]}
        tags: {type: array, items: {type: string}}
        capture: {$ref: "#/components/schemas/CaptureValue"}
      additionalProperties: true
    NoteReply:
      type: object
      properties:
        ok: {type: boolean}
        error: {type: string}
        note: {$ref: "#/components/schemas/Note"}
        session: {type: string}
      additionalProperties: true
    AudioChunkReply:
      type: object
      required: [ok, track, seq, bytes, closed]
      properties:
        ok: {const: true}
        track: {type: string}
        seq: {type: integer}
        bytes: {type: number}
        closed: {type: boolean}
      additionalProperties: true
    AccelRequest:
      type: object
      required: [samples]
      properties:
        source: {type: string, enum: [phone, imu], default: phone}
        samples:
          type: array
          maxItems: 5000
          items:
            type: array
            description: "`[epoch_ms, ax, ay, az]`."
            prefixItems: [{type: number}, {type: number}, {type: number}, {type: number}]
            minItems: 4
            maxItems: 4
      additionalProperties: true
    AccelReply:
      type: object
      required: [ok, samples, rows]
      properties:
        ok: {const: true}
        samples: {type: integer}
        rows: {}
      additionalProperties: true
    AccelCalRequest:
      type: object
      required: [matrix]
      properties:
        matrix:
          type: array
          minItems: 3
          maxItems: 3
          items: {type: array, items: {type: number}, minItems: 3, maxItems: 3}
        source: {type: string, enum: [phone, imu], default: phone}
        method: {type: string, pattern: "^[A-Za-z0-9+_-]{1,32}$", default: manual}
      additionalProperties: true
    AccelCalReply:
      type: object
      required: [ok, accel_cal]
      properties:
        ok: {const: true}
        accel_cal: {$ref: "#/components/schemas/AccelCal"}
      additionalProperties: true
    # ---- stored UI layouts (drive-modes spec §8.3, DM2) ----
    LayoutKind:
      type: string
      enum: [drive_mode, home, rail, strip]
    LayoutClassName:
      type: string
      enum: [hu5, hu7, hu9, huwide, phone, tablet, desktop]
    OstlerLayout:
      type: object
      description: An `ostler.layout/1` document (`schemas/ostler-layout.schema.json`; checked by `openostler.layouts`).
      required: [format, kind, id, name, classes]
      properties:
        format: {const: ostler.layout/1}
        kind: {$ref: "#/components/schemas/LayoutKind"}
        id: {type: string}
        name: {type: string}
        base:
          type: object
          required: [preset, version]
          properties:
            preset: {type: string}
            version: {type: integer, minimum: 1}
        classes: {type: object}
      additionalProperties: true
    LayoutIssue:
      type: object
      required: [rule, message]
      properties:
        rule: {type: string, description: "A stable rule code (`moving.too_many_tiles`, `schema`, `text.too_long` …)."}
        message: {type: string}
        class: {$ref: "#/components/schemas/LayoutClassName"}
        face: {type: string}
        slot: {type: string}
      additionalProperties: true
    LayoutSource:
      type: string
      enum: [user, car, pack, generated]
      description: "Where the layout came from: this user's copy, the car profile's, the pack's (tier 2), or the shell's own preset or generated default (tier 1, `layout: null`)."
    LayoutResolved:
      type: object
      required: [source, layout, etag]
      properties:
        vid: {type: string}
        class: {$ref: "#/components/schemas/LayoutClassName"}
        kind: {$ref: "#/components/schemas/LayoutKind"}
        id: {type: string}
        source: {$ref: "#/components/schemas/LayoutSource"}
        profile: {type: [string, "null"], description: The profile whose copy it is (null for pack and generated).}
        requested_profile: {type: string}
        layout:
          oneOf:
            - {$ref: "#/components/schemas/OstlerLayout"}
            - {type: "null"}
        rev: {type: [integer, "null"]}
        updated_utc:
          oneOf:
            - {$ref: "#/components/schemas/Rfc3339Utc"}
            - {type: "null"}
        etag: {type: string}
      additionalProperties: true
    LayoutHeldEntry:
      type: object
      required: [seq, op]
      properties:
        seq: {type: integer}
        op: {type: string, enum: [put, delete, reset, undo_reset]}
        kind: {type: [string, "null"]}
        id: {type: [string, "null"]}
        requested_utc: {$ref: "#/components/schemas/Rfc3339Utc"}
      additionalProperties: true
    LayoutSnapshot:
      type: [object, "null"]
      description: The Before reset snapshot (§7.8), kept 7 days; null when there is none.
      properties:
        taken_utc: {$ref: "#/components/schemas/Rfc3339Utc"}
        expires_utc: {$ref: "#/components/schemas/Rfc3339Utc"}
        scope: {type: string, description: "`all`, a kind, or `<kind>/<id>` for one layout."}
        layouts:
          type: array
          items:
            type: object
            properties:
              kind: {$ref: "#/components/schemas/LayoutKind"}
              id: {type: string}
      additionalProperties: true
    LayoutList:
      type: object
      required: [vid, profile, class, layouts, held, snapshot]
      properties:
        vid: {type: string}
        profile: {type: string}
        class: {$ref: "#/components/schemas/LayoutClassName"}
        driving_state: {type: string, enum: [parked, idling, moving, unknown]}
        layouts:
          type: array
          items: {$ref: "#/components/schemas/LayoutResolved"}
        held:
          type: array
          items: {$ref: "#/components/schemas/LayoutHeldEntry"}
        snapshot: {$ref: "#/components/schemas/LayoutSnapshot"}
      additionalProperties: true
    LayoutPutReply:
      allOf:
        - {$ref: "#/components/schemas/LayoutResolved"}
        - type: object
          required: [ok]
          properties:
            ok: {const: true}
            warnings:
              type: array
              items: {$ref: "#/components/schemas/LayoutIssue"}
    LayoutHeld:
      type: object
      required: [ok, queued, held, seq]
      properties:
        ok: {const: true}
        queued: {const: true}
        held: {const: true}
        seq: {type: integer}
        message: {type: string}
      additionalProperties: true
    LayoutRefusal:
      type: object
      description: What a refused layout write adds to the error envelope.
      properties:
        errors:
          type: array
          items: {$ref: "#/components/schemas/LayoutIssue"}
        warnings:
          type: array
          items: {$ref: "#/components/schemas/LayoutIssue"}
    LayoutDeleteReply:
      type: object
      required: [ok, deleted, resolved]
      properties:
        ok: {const: true}
        deleted: {type: boolean}
        resolved: {$ref: "#/components/schemas/LayoutResolved"}
        snapshot: {$ref: "#/components/schemas/LayoutSnapshot"}
      additionalProperties: true
    LayoutResetReply:
      type: object
      required: [ok, reset]
      properties:
        ok: {const: true}
        reset: {type: integer}
        kind: {type: [string, "null"]}
        snapshot: {$ref: "#/components/schemas/LayoutSnapshot"}
      additionalProperties: true
    LayoutUndoReply:
      type: object
      required: [ok, restored]
      properties:
        ok: {const: true}
        restored: {type: integer}
      additionalProperties: true
    DriveSelection:
      type: object
      required: [mode]
      properties:
        mode: {type: string, description: The active mode's layout id.}
        faces:
          type: object
          description: The face shown per mode (0-2).
          additionalProperties: {type: integer, minimum: 0, maximum: 2}
        rotation:
          type: array
          maxItems: 4
          items: {type: string}
          description: The one-tap rotation; omitted keeps the stored one.
        updated_utc: {$ref: "#/components/schemas/Rfc3339Utc"}
      additionalProperties: true
    DriveSelectionReply:
      type: object
      required: [vid, profile, display, class, selection]
      properties:
        ok: {const: true}
        vid: {type: string}
        profile: {type: string}
        display: {type: string}
        class: {$ref: "#/components/schemas/LayoutClassName"}
        selection:
          oneOf:
            - {$ref: "#/components/schemas/DriveSelection"}
            - {type: "null"}
      additionalProperties: true
