# Dokploy git-source stack for the Pineshouse homelab.
#
# Routing: the container publishes host port 9110 (→ container 8080) on swarm-node1, and a
# Traefik file-provider route (traefik_route_upsert: d2.pineshouse.co.uk → http://192.168.0.170:9110)
# forwards to it. Cloudflare Tunnel's *.pineshouse.co.uk wildcard already reaches Traefik,
# and Cloudflare Access gates the hostname. 9110 is an unused port (>9100 per the registry);
# the container's own 8080 is never published directly.
#
# Secret: D2DIAG_ADMIN_PW gates the /admin mapping endpoints — set it in the Dokploy stack
# env, never hardcoded here. logs/ is a writable private volume (the app creates logs/ at
# startup; may hold VIN/EKA data once a car is connected — keep it private).
services:
  d2diag:
    build:
      context: .
      args:
        # The Discovery 2 pack's git ref (ADR-0015).
        PACK_REF: "${PACK_REF:-main}"
    # Same as the Dockerfile CMD: live (no demo mode, ADR-0011), no sniff feed (the Decode
    # tab reads only a live ESP32 sniffer, --sniff) and the OSM geocoder on.
    command: ["python", "tools/dashboard.py", "--host", "0.0.0.0", "--port", "8080",
              "--geocoder", "https://nominatim.openstreetmap.org"]
    restart: unless-stopped
    networks:
      - dokploy-network
    ports:
      - "9110:8080"
    environment:
      D2DIAG_ADMIN_PW: "${D2DIAG_ADMIN_PW}"
    volumes:
      - d2-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/snapshot', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  dokploy-network:
    external: true

volumes:
  d2-logs:
