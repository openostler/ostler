# Dokploy git-source stack for the Pineshouse homelab.
#
# Routing: the container joins the external `dokploy-network` and publishes NO host port.
# Dokploy injects the Traefik labels (websecure + wildcard TLS) from the domain configured
# in its UI/API (d2.pineshouse.co.uk → container port 8080). Cloudflare Tunnel's
# *.pineshouse.co.uk wildcard already forwards to Traefik, and Cloudflare Access gates it.
#
# Secret: D2DIAG_ADMIN_PW gates the /admin mapping endpoints — set it in the Dokploy stack
# env (sourced from 1Password), never hardcoded here. logs/ is a writable private volume
# (the app creates logs/ at startup; may hold VIN/EKA data in live mode — keep it private).
services:
  d2diag:
    build: .
    restart: unless-stopped
    networks:
      - dokploy-network
    environment:
      D2DIAG_ADMIN_PW: "${D2DIAG_ADMIN_PW}"
    volumes:
      - d2-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/snapshot', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  dokploy-network:
    external: true

volumes:
  d2-logs:
