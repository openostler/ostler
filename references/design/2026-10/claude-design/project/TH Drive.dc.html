<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Barlow:wght@400;500;600;700;800&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;family=Bitter:wght@400;500;600;700;800&amp;family=Figtree:wght@400;500;600;700;800&amp;family=Manrope:wght@200;300;400;500;600;700&amp;family=DM+Serif+Display&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Outfit:wght@300;400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,300;1,600;1,700;1,800&amp;family=Archivo:wght@500;700;800;900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Share+Tech+Mono&amp;family=Nunito:wght@400;600;700;800;900&amp;family=Lexend:wght@400;500;600;700&amp;family=Albert+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&amp;display=block">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="drive-maps.js"></script>
<script src="ostler-themes.js"></script>
</helmet>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
<div style="padding:{{ bzP }}px;background:#000;border-radius:{{ bzR }}px;box-shadow:0 30px 60px rgba(10,16,32,.35);width:max-content">
<div data-screen-label="{{ label }}" style="width:{{ W }}px;height:{{ H }}px;background-color:{{ c.bg }};background-image:{{ c.bgImg }};background-size:cover;color:{{ c.tx }};font-family:{{ c.ff }};position:relative;overflow:hidden;border-radius:{{ sR }}px;display:flex;flex-direction:column">
<sc-if value="{{ c.bgMap }}" hint-placeholder-val="{{ false }}">{{ bgTrace }}<sc-if value="{{ bgUrl }}" hint-placeholder-val="{{ false }}"><img src="{{ bgUrl }}" alt="" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;filter:{{ c.mapF }}"></sc-if></sc-if>
<sc-if value="{{ hu }}" hint-placeholder-val="{{ true }}"><dc-import name="TH Strip" theme="{{ theme }}" size="{{ size }}" moving="{{ moving }}" drive="{{ true }}" hint-size="100%,56px"></dc-import></sc-if>
<sc-if value="{{ ph }}" hint-placeholder-val="{{ false }}">
<div style="height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 36px;font-size:16px;font-weight:600;position:relative;z-index:2"><span style="font-variant-numeric:tabular-nums">08:52</span><span class="material-symbols-rounded" style="font-size:20px">battery_full</span></div>
<div style="height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;position:relative;z-index:2;font-size:16px;font-weight:700">
<div style="width:48px;height:48px;border-radius:{{ c.rc }}px;background-color:{{ c.s2 }};box-shadow:{{ c.bd }};display:flex;align-items:center;justify-content:center"><span class="material-symbols-rounded" style="font-size:24px">arrow_back</span></div>
<div style="height:48px;border-radius:{{ c.rc }}px;background-color:{{ c.s2 }};box-shadow:{{ c.bd }};display:flex;align-items:center;gap:6px;padding:0 14px"><span class="material-symbols-rounded" style="font-size:22px">speed</span>Dash</div>
<div style="height:40px;border-radius:20px;background:#ef6a7d;color:#1a0a0e;display:flex;align-items:center;gap:4px;padding:0 12px 0 8px;font-family:Figtree,sans-serif;font-weight:800"><span class="material-symbols-rounded" style="font-size:20px;font-variation-settings:'FILL' 1">warning</span>1 FAULT</div>
</div>
</sc-if>
<div style="flex:1;min-height:0;display:grid;grid-template-columns:{{ cols }};grid-template-rows:{{ rows }};gap:{{ gap }}px;padding:{{ pad }};position:relative;z-index:1">
<sc-for list="{{ tiles }}" as="t" hint-placeholder-count="4"><div style="grid-column:{{ t.gc }};grid-row:{{ t.gr }};background-color:{{ c.s1 }};background-image:{{ c.tex }};border-radius:{{ c.rCard }};box-shadow:{{ c.bd }};backdrop-filter:{{ c.bf }};padding:{{ tp }};display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 6px"><span style="font-size:{{ lfs }}px;font-weight:{{ c.lblW }};letter-spacing:{{ c.lblLs }};text-transform:{{ c.lblTT }};font-variant-caps:{{ c.lblFV }};color:{{ c.lblC }};background-color:{{ c.lblBg }};padding:{{ c.lblP }};border-radius:{{ c.lblR }}px;align-self:flex-start;font-family:{{ c.fh }}">{{ t.l }}</span><span style="font-size:{{ lfs }}px;font-weight:800;color:{{ t.wc }};background:{{ t.wbg }};padding:{{ t.wp }};border-radius:12px;font-family:Figtree,sans-serif;flex:none;margin-left:auto">{{ t.w }}</span></div>
<span style="font-family:{{ c.fn }};font-weight:{{ c.wN }};font-style:{{ c.numIt }};letter-spacing:{{ c.numLs }};font-size:{{ vfs }}px;line-height:1;font-variant-numeric:tabular-nums;color:{{ t.vc }};white-space:nowrap">{{ t.v }}<span style="font-size:{{ ufs }}px;color:{{ c.t2 }}"> {{ t.u }}</span></span>
<div style="width:100%">{{ t.g }}</div>
</div></sc-for>
<div style="grid-column:{{ hgc }};grid-row:{{ hgr }};display:flex;align-items:center;justify-content:center;min-width:0">
<div style="position:relative;width:{{ S }}px;height:{{ S }}px;border-radius:{{ c.heroR }};background-color:{{ c.heroBg }};background-image:{{ c.tex }};box-shadow:{{ heroSh }};clip-path:{{ c.heroClip }};backdrop-filter:{{ c.bf }}">
{{ sweep }}
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:{{ hg }}px">
<sc-if value="{{ c.shift }}" hint-placeholder-val="{{ false }}"><div style="margin-bottom:6px">{{ shift }}</div></sc-if>
<span style="font-family:{{ c.fn }};font-weight:{{ c.wN }};font-style:{{ c.numIt }};letter-spacing:{{ c.numLs }};font-size:{{ sfs }}px;line-height:.9;color:{{ c.spd }};font-variant-numeric:tabular-nums;letter-spacing:-.02em">72</span>
<span style="font-size:{{ lfs }}px;font-weight:700;color:{{ c.t2 }}">km/h</span>
<div style="display:flex;gap:10px;align-items:center;margin-top:4px"><span style="min-width:{{ gS }}px;height:{{ gS }}px;border-radius:{{ c.r2 }}px;background-color:{{ c.s3 }};box-shadow:{{ c.bd }};display:flex;align-items:center;justify-content:center;font-family:{{ c.fn }};font-size:{{ lfs }}px;font-weight:800">D</span><span style="font-family:{{ c.fn }};font-size:{{ lfs }}px;font-weight:700;color:{{ c.t2 }};font-variant-numeric:tabular-nums;white-space:nowrap">1 850 rpm</span></div>
</div>
</div>
</div>
</div>
</div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
 state={bg:''};
 componentDidMount(){const go=()=>{if(this.dead)return;const T=window.OstlerThemes;if(!T||!T.resolve||!window.OstlerMaps)return setTimeout(go,120);this.forceUpdate();const c=T.resolve(this.props.theme||'night');
  if(c.bgMap)window.OstlerMaps.get(this.props.size==='phone'?'gPH':'tHU').then(r=>{if(r&&!this.dead)this.setState({bg:r.url})})};go()}
 componentWillUnmount(){this.dead=true}
 renderVals(){
  const T=window.OstlerThemes;if(!T||!T.resolve)return {ready:false};
  const p=this.props,id=p.theme||'night',sz=p.size||'hu7',mv=p.moving!==false,c=T.resolve(id,{moving:mv}),h=React.createElement,ph=sz==='phone',hu5=sz==='hu5';
  const W=ph?393:hu5?800:1024,H=ph?852:hu5?480:600;
  const S=ph?340:hu5?392:500;
  const D=[['Coolant','88','°C',.55,[.4,.75],0],['Battery','14.1','V',.6,[.45,.8],0],['Intake','120','°C',.92,[.3,.65],1],['Boost','0.9','bar',.45,[.3,.7],0]];
  const pos=ph?[['1','2'],['2','2'],['1','3'],['2','3']]:[['1','1'],['1','2'],['3','1'],['3','2']];
  const tiles=D.map(([l,v,u,f,band,al],i)=>({l,v,u,gc:pos[i][0],gr:pos[i][1],w:al?'HIGH':'OK',wc:al?'#1a0a0e':c.okT,wbg:al?'#ef6a7d':'transparent',wp:al?'2px 10px':'0',vc:al?c.alT:c.tx,g:T.bar(h,c,{f,band,alarm:!!al,h:c.gauge==='needle'?(ph?44:hu5?44:64):(ph?12:16)})}));
  const heroSh=[c.bd!=='none'?c.bd:'',c.glow!=='none'?c.glow:''].filter(Boolean).join(',')||'none';
  return {ready:true,c,theme:id,size:sz,moving:mv,hu:!ph,ph,W,H,S,bzP:ph?0:14,bzR:ph?48:24,sR:ph?48:6,
   label:c.name+' · Drive · '+(ph?'phone':hu5?'HU-5':'HU-7')+(mv?' · Moving-safe':' · Parked'),
   cols:ph?'1fr 1fr':'1fr '+S+'px 1fr',rows:ph?S+'px 1fr 1fr':'1fr 1fr',gap:ph?10:hu5?8:10,pad:ph?'4px 12px 24px':hu5?'6px 10px 10px':'6px 12px 12px',tp:ph?'10px 12px':hu5?'10px 12px':'14px 16px',
   lfs:ph?14:24,vfs:ph?40:hu5?56:72,ufs:ph?14:24,sfs:Math.round(S*.3),hg:ph?2:4,gS:ph?28:44,
   tiles,hgc:ph?'1 / span 2':'2',hgr:ph?'1':'1 / span 2',heroSh:(c.hero==='bare'||c.hero==='cut')?'none':heroSh,
   sweep:T.sweep(h,c,{size:S,f:.37,red:.8}),shift:c.shift?T.shift(h,c,{w:Math.round(S*.46),f:.37,h:ph?12:16}):null,
   bgTrace:c.bgMap?T.trace(h,c,{w:W,h:H,pad:40}):null,bgUrl:this.state.bg};
 }
}
</script>
</body>
</html>
