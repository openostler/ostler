# SPDX-FileCopyrightText: 2026 OpenOstler contributors
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# REUSE 3.3 bulk annotations (https://reuse.software/spec-3.3/). Source files carry their
# own SPDX headers (`reuse annotate`); this file covers docs, config, data, generated and
# binary files, which cannot or should not carry a header. When several tables match a
# file, the last one wins, so the specific tables come after the general ones.
# Licence policy: ADR-0012 (code and docs AGPL-3.0-or-later, vehicle data CC BY-SA 4.0),
# ADR-0016 (COVESA VSS, MPL-2.0). Check with `reuse lint`.

version = 1
SPDX-PackageName = "openostler"
SPDX-PackageSupplier = "OpenOstler contributors <https://github.com/openostler>"
SPDX-PackageDownloadLocation = "https://github.com/openostler/ostler"

# Docs stay under the code licence (owner decision; standards research §8.4 Q1).
[[annotations]]
path = ["**/*.md"]
SPDX-FileCopyrightText = "2026 OpenOstler contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Project config and build metadata that cannot take a comment header (JSON) or that we
# keep header-free for brevity.
[[annotations]]
path = [
    ".gitignore",
    "**/.gitignore",
    ".dockerignore",
    "Dockerfile",
    "pyproject.toml",
    "ui/package.json",
    "ui/package-lock.json",
    "ui/tsconfig.json",
    "ui/tsconfig.node.json",
    "ui/eslint-suppressions.json",
    "ui/stylelint-baseline.json",
    "vss/VERSION",
]
SPDX-FileCopyrightText = "2026 OpenOstler contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Contract files added in U0 (JSON Schema, OpenAPI, AsyncAPI).
[[annotations]]
path = ["schemas/**", "api/**"]
SPDX-FileCopyrightText = "2026 OpenOstler contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# HTML pages, the favicon and the web app manifest: a comment before <!DOCTYPE html> would
# switch browsers to quirks mode, ui/index.html is copied into the committed build, and the
# manifest is JSON.
[[annotations]]
path = [
    "ui/index.html",
    "ui/public/favicon.svg",
    "ui/public/manifest.webmanifest",
]
SPDX-FileCopyrightText = "2026 OpenOstler contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "src/openostler/web/dashboard.html"
SPDX-FileCopyrightText = ["2026 OpenOstler contributors", "2026 leijoma"]
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The legacy v2 page inlines the Astryx neutral theme token values (MIT).
[[annotations]]
path = "src/openostler/web/dashboard_v2.html"
SPDX-FileCopyrightText = [
    "2026 OpenOstler contributors",
    "2026 leijoma",
    "Meta Platforms, Inc. and affiliates",
]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT"

# The research inventory and the design hand-off index are part of the docs. Design files
# (PNG, HTML) added under references/design/ get their own annotation, naming their
# copyright holder, in the commit that adds them (references/design/2026-10/README.md §1).
[[annotations]]
path = ["references/research/*.json", "references/design/**/*.json"]
SPDX-FileCopyrightText = "2026 OpenOstler contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Vehicle data (LICENSE-DATA): test fixtures, UI API fixtures and the synthetic sniff log.
[[annotations]]
path = [
    "tests/fixtures/**",
    "ui/src/api/fixtures/**",
    "ui/e2e/sniff-demo.txt",
]
SPDX-FileCopyrightText = "2026 OpenOstler contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# NodeSource fixtures (NodeSource spec §13): td5-vectors, slabs-vectors,
# slabs-vectors-no-priority, lifecycle and gate-conflict are generated by the node
# firmware's host tests (ostler-firmware, firmware/node/host/fixtures/, commit 5971323)
# from the shared Discovery 2 vectors and fake ECUs; cluster and
# status-power are hand-written here for what the node does not publish. Synthetic, no
# VIN. See tests/fixtures/node/README.md.
[[annotations]]
path = "tests/fixtures/node/*.jsonl"
SPDX-FileCopyrightText = "2026 OpenOstler contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# J1979 (spec §10): the shared test vectors and the Mode 06 unit-and-scaling table are
# written from the standard as facts, CC BY-SA like the other vehicle data.
[[annotations]]
path = [
    "tests/vectors/**/*.json",
    "src/openostler/obd/uas.json",
]
SPDX-FileCopyrightText = "2026 OpenOstler contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# W3C design tokens (U1): the calm-instrument colour values are adapted from the Astryx
# neutral theme (MIT), as styles.css was before them.
[[annotations]]
path = "ui/tokens/*.tokens.json"
SPDX-FileCopyrightText = ["2026 OpenOstler contributors", "Meta Platforms, Inc. and affiliates"]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT"

# Material Symbols (U1 icon set): a verbatim subset of the outlined, weight-400 SVGs from the
# npm package @material-symbols/svg-400 0.47.6 (github.com/marella/material-symbols), which
# repackages Google's google/material-design-icons. Unmodified; see THIRD_PARTY_LICENSES.md.
[[annotations]]
path = "ui/src/icons/material-symbols/*.svg"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"

# Figtree (visual design system spec §4, V1b): the variable font from google/fonts
# (ofl/figtree/Figtree[wght].ttf, version 2.002), limited to weights 400-700 and subset to
# the Latin and Latin-ext ranges as woff2 with fontTools; no Reserved Font Name. The copies
# in the committed build are the same files.
[[annotations]]
path = ["ui/public/fonts/*.woff2", "src/openostler/web/static/fonts/*.woff2"]
SPDX-FileCopyrightText = "2022 The Figtree Project Authors (https://github.com/erikdkennedy/figtree)"
SPDX-License-Identifier = "OFL-1.1"

# The committed UI build (generated by `cd ui && npm run build`, never hand-edited). It
# bundles React and zod (MIT) and MapLibre GL JS (BSD-3-Clause, with MIT and BSD parts),
# the Astryx-derived tokens (MIT) and the Material Symbols path data (Apache-2.0). See
# THIRD_PARTY_LICENSES.md.
[[annotations]]
path = "src/openostler/web/static/**"
SPDX-FileCopyrightText = [
    "2026 OpenOstler contributors",
    "Meta Platforms, Inc. and affiliates",
    "2025 Colin McDonnell",
    "2023 MapLibre contributors",
    "2020 Mapbox",
    "2011 Evan Wallace",
    "2010-2016 Mike Bostock",
    "Google LLC",
]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT AND BSD-3-Clause AND Apache-2.0"

# GeoNames place names, trimmed by src/openostler/geo/build.py (ADR-0011).
[[annotations]]
path = "src/openostler/geo/places.tsv.gz"
SPDX-FileCopyrightText = "GeoNames <https://www.geonames.org/>"
SPDX-License-Identifier = "CC-BY-4.0"

# COVESA Vehicle Signal Specification (ADR-0016). The pinned upstream release and the leaf
# list generated from it are MPL-2.0 like VSS itself; our overlay is vehicle data (CC BY-SA,
# SPDX header in the file); metrics.json mixes VSS descriptions with our aliases.
[[annotations]]
path = ["vss/upstream/**", "src/openostler/vss_leaves.json"]
SPDX-FileCopyrightText = "Contributors to COVESA"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "src/openostler/metrics.json"
SPDX-FileCopyrightText = [
    "2026 OpenOstler contributors",
    "Contributors to COVESA",
]
SPDX-License-Identifier = "MPL-2.0 AND CC-BY-SA-4.0"

# Drive modes (drive-modes spec §4-§5, DM1): the shared Moving limits are code-adjacent
# config; the shipped presets are layouts as data, CC BY-SA 4.0 like other shared layouts
# (ADR-0012), as the spec's §5 says.
[[annotations]]
path = "src/openostler/layout_limits.json"
SPDX-FileCopyrightText = "2026 OpenOstler contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "ui/src/drive/presets/*.json"
SPDX-FileCopyrightText = "2026 OpenOstler contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Claude Design bundle (references/design/2026-10/claude-design/README.md): the owner's
# exported design project, HTML/CSS/JS prototypes, the session transcript and its uploads.
# support.js is the Claude Design runtime as exported with the bundle.
[[annotations]]
path = "references/design/2026-10/claude-design/**"
SPDX-FileCopyrightText = "2026 OpenOstler contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
