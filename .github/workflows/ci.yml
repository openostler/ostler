name: ci

on:
  push:
  pull_request:

# The Discovery 2 reference pack (ADR-0015) runs the integration tests and the e2e suite.
# Switch PACK_REF to main once the pack's split-pack branch is merged.
env:
  PACK_REF: split-pack
  PACK_REPO: https://github.com/JamesWrightDavid/discovery2-diag

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Install the D2 reference pack
        run: pip install --no-deps "d2diag @ git+${PACK_REPO}@${PACK_REF}"
      - name: Tests (the pack is required here, so needs_pack tests must run, not skip)
        run: pytest -q
        env:
          OSTLER_REQUIRE_PACK: "1"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate frontmatter
        run: python3 skill/scripts/validate_frontmatter.py
      - name: Links and doc paths resolve
        run: python3 skill/scripts/check_links.py
      - name: INDEX.md is up to date
        run: |
          python3 skill/scripts/build_index.py
          # The generated date line changes daily; compare everything else.
          git diff --exit-code -I '^updated: ' -- INDEX.md

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed build output is current
        run: git diff --exit-code -- ../src/openostler/web/static && test -z "$(git status --porcelain -- ../src/openostler/web/static)"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Install the D2 reference pack
        run: pip install --no-deps "d2diag @ git+${PACK_REPO}@${PACK_REF}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npx playwright test
        working-directory: ui
        env:
          PYTHON: python
