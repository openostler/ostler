name: ci

on:
  push:
  pull_request:

# Least privilege (OpenSSF Scorecard Token-Permissions): jobs only read the repo.
permissions:
  contents: read

# The Discovery 2 reference pack (ADR-0015) runs the integration tests and the e2e suite.
# PACK_REF: the D2 pack ref CI tests against (a branch or tag).
env:
  PACK_REF: main
  PACK_REPO: https://github.com/openostler/ostler-pack-lr-d2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # The [signing] extra too (ADR-0041): the grant-signing tests skip without it and
      # must run here (OSTLER_REQUIRE_SIGNING).
      - run: pip install -e ".[dev,signing]"
      - name: Install the D2 reference pack
        # A source checkout, not a git+ wheel: the pack serves its docs (references/, docs/)
        # from the checkout, and the Docs tab and its e2e test need them.
        run: |
          git clone --depth 1 --branch "$PACK_REF" "$PACK_REPO" "$RUNNER_TEMP/d2-pack"
          pip install --no-deps -e "$RUNNER_TEMP/d2-pack"
      - name: Tests (the pack and the signing extra are required here, so their tests must run, not skip)
        run: pytest -q
        env:
          OSTLER_REQUIRE_PACK: "1"
          OSTLER_REQUIRE_SIGNING: "1"
      - name: metrics.json is current (vss-tools from the [dev] extra, ADR-0016)
        run: |
          python -c "import vss_tools" || { echo "vss-tools missing: the [dev] extra installs it on Python >= 3.11"; exit 1; }
          python tools/build_metrics.py --check

  # SocketCanLink and KernelIsoTpChannel on a real vcan0 (CanLink spec §9). The test job
  # skips these; here a skip is a failure (OSTLER_REQUIRE_VCAN).
  vcan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Load vcan (and can-isotp if the runner kernel has it), bring up vcan0
        run: |
          if ! sudo modprobe vcan; then
            sudo apt-get update -q
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -details link show vcan0
          # Kernel ISO-TP is optional (KernelIsoTpChannel): required here only if it loads.
          if sudo modprobe can-isotp; then
            echo "OSTLER_REQUIRE_CAN_ISOTP=1" >> "$GITHUB_ENV"
          else
            echo "::warning::can-isotp did not load on $(uname -r); the kernel ISO-TP vcan test will skip"
          fi
      - name: needs_vcan tests (a skip fails the job)
        run: pytest -q -rs -m needs_vcan tests/test_can_backends.py
        env:
          OSTLER_REQUIRE_VCAN: "1"

  # The stdlib MQTT 5 client and NodeSource against a real Mosquitto (NodeSource spec §13):
  # retained and will handling, a resumed session (the raw tap's), mTLS and the spec §5
  # ACL. The test job skips these; here a skip is a failure (OSTLER_REQUIRE_BROKER).
  broker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Install Mosquitto (the binary; each test starts its own broker)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mosquitto openssl
          sudo systemctl stop mosquitto || true
          dpkg-query -W mosquitto openssl
      - name: needs_broker tests (a skip fails the job)
        run: pytest -q -rs -m needs_broker tests/test_mqtt_mosquitto.py
        env:
          OSTLER_REQUIRE_BROKER: "1"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: REUSE (every file has a licence and a copyright notice)
        run: reuse lint

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate frontmatter
        run: python3 skill/scripts/validate_frontmatter.py
      - name: Links and doc paths resolve
        run: python3 skill/scripts/check_links.py
      - name: INDEX.md is up to date
        run: |
          python3 skill/scripts/build_index.py
          # The generated date line changes daily; compare everything else.
          git diff --exit-code -I '^updated: ' -- INDEX.md

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed build output is current
        run: git diff --exit-code -- ../src/openostler/web/static && test -z "$(git status --porcelain -- ../src/openostler/web/static)"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Install the D2 reference pack
        # A source checkout, not a git+ wheel: the pack serves its docs (references/, docs/)
        # from the checkout, and the Docs tab and its e2e test need them.
        run: |
          git clone --depth 1 --branch "$PACK_REF" "$PACK_REPO" "$RUNNER_TEMP/d2-pack"
          pip install --no-deps -e "$RUNNER_TEMP/d2-pack"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npx playwright test
        working-directory: ui
        env:
          PYTHON: python
