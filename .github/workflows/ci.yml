name: ci

on:
  push:
  pull_request:

# Least privilege (OpenSSF Scorecard Token-Permissions): jobs only read the repo.
permissions:
  contents: read

# The Discovery 2 reference pack (ADR-0015) runs the integration tests and the e2e suite.
# PACK_REF: the D2 pack ref CI tests against (a branch or tag).
env:
  PACK_REF: main
  PACK_REPO: https://github.com/JamesWrightDavid/discovery2-diag

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Install the D2 reference pack
        # A source checkout, not a git+ wheel: the pack serves its docs (references/, docs/)
        # from the checkout, and the Docs tab and its e2e test need them.
        run: |
          git clone --depth 1 --branch "$PACK_REF" "$PACK_REPO" "$RUNNER_TEMP/d2-pack"
          pip install --no-deps -e "$RUNNER_TEMP/d2-pack"
      - name: Tests (the pack is required here, so needs_pack tests must run, not skip)
        run: pytest -q
        env:
          OSTLER_REQUIRE_PACK: "1"
      - name: metrics.json is current (vss-tools from the [dev] extra, ADR-0016)
        run: |
          python -c "import vss_tools" || { echo "vss-tools missing: the [dev] extra installs it on Python >= 3.11"; exit 1; }
          python tools/build_metrics.py --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: REUSE (every file has a licence and a copyright notice)
        run: reuse lint

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate frontmatter
        run: python3 skill/scripts/validate_frontmatter.py
      - name: Links and doc paths resolve
        run: python3 skill/scripts/check_links.py
      - name: INDEX.md is up to date
        run: |
          python3 skill/scripts/build_index.py
          # The generated date line changes daily; compare everything else.
          git diff --exit-code -I '^updated: ' -- INDEX.md

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed build output is current
        run: git diff --exit-code -- ../src/openostler/web/static && test -z "$(git status --porcelain -- ../src/openostler/web/static)"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Install the D2 reference pack
        # A source checkout, not a git+ wheel: the pack serves its docs (references/, docs/)
        # from the checkout, and the Docs tab and its e2e test need them.
        run: |
          git clone --depth 1 --branch "$PACK_REF" "$PACK_REPO" "$RUNNER_TEMP/d2-pack"
          pip install --no-deps -e "$RUNNER_TEMP/d2-pack"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npx playwright test
        working-directory: ui
        env:
          PYTHON: python
