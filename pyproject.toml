[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openostler"
version = "0.0.1"
description = "Ostler — the open vehicle platform"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-DATA", "LICENSES/*"]
dependencies = ["pyserial>=3.5"]

[project.urls]
Homepage = "https://ostler.tech"
Source = "https://github.com/openostler/ostler"

[project.optional-dependencies]
# Dev-only tools (ADR-0002, ADR-0017); never installed on a Pi. reuse is GPL-3.0-or-later,
# CI only. vss-tools (ADR-0016) needs Python >= 3.11, so it is skipped on older
# interpreters; tools/build_metrics.py and the metrics.json freshness test need it.
dev = [
    "pytest>=7",
    "reuse>=5",
    "ruff>=0.8",
    "pyyaml>=6",
    "openapi-spec-validator>=0.7.1",
    "jsonschema>=4.18",
    "vss-tools==6.1.0; python_version >= '3.11'",
    # can-isotp (MIT) is only the dev-time reference for the differential ISO-TP test T16
    # (CanLink spec §6, owner Q8); no runtime code imports it.
    "can-isotp>=2.0",
]
# python-can (LGPL-3.0) for desktop CAN dongles without a SocketCAN driver (PCAN, Kvaser,
# Vector on macOS/Windows; CanLink spec §3, ADR-0020, ADR-0035). Optional, imported lazily
# by openostler.can.pycan only; never installed on a Pi, where SocketCAN is stdlib.
can = ["python-can>=4.0"]

# No vehicle entry point here: the platform ships no pack (ADR-0013, ADR-0015). Packs
# register under [project.entry-points."openostler.vehicle"], e.g. the Discovery 2 pack
# "d2diag" (lr_d2 = "d2diag:PACK").

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openostler" = ["metrics.json", "vss_leaves.json"]
"openostler.web" = ["dashboard.html", "dashboard_v2.html", "static/*", "static/assets/*"]
"openostler.geo" = ["*.tsv.gz"]
"openostler.obd" = ["uas.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "needs_pack: integration test that needs the Discovery 2 reference pack (d2diag) installed",
    "fake_pack: run with tests/fake_pack.py FAKE_PACK active (platform logic, no real pack)",
    "needs_vcan: runs SocketCanLink on a real vcan0; skipped where the runner has none (CanLink spec §9)",
    "needs_broker: runs the MQTT client against a real Mosquitto; skipped where none is installed (NodeSource spec §13)",
]

# Ruff (ADR-0017, dev-only). The rule set is E, F, I, B and UP; the ignores below keep the
# current codebase passing without a mass reformat. Tighten them one rule at a time.
[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["ui", "src/openostler/web/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # line length: no formatter run yet
    "E402",   # imports after sys.path setup or docstring-adjacent code
    "I001",   # import order: adopt with a one-off `ruff check --select I --fix`
    "UP006",  # PEP 585 builtins in annotations
    "UP035",  # deprecated typing imports
    "UP037",  # quoted annotations
    "UP045",  # Optional[X] -> X | None
    "UP031",  # printf-style formatting
    "B027",   # empty optional hooks on abstract base classes are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B007", "B011", "B017", "B023", "E702", "E741"]

# mypy (ADR-0017): configured, not enforced yet. Gradual adoption starts with pack.py and
# commands.py (standards research §6).
[tool.mypy]
python_version = "3.9"
files = ["src/openostler"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = false
