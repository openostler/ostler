[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "d2diag"
version = "0.0.1"
description = "Open, modular diagnostics platform for the Land Rover Discovery 2 Td5"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"d2diag.web" = ["dashboard.html", "dashboard_v2.html", "static/*", "static/assets/*"]
"d2diag.geo" = ["*.tsv.gz"]
"d2diag.vehicles.lr_d2" = ["layout.json", "signals/*.json", "dtc/*.json", "td5/*.json",
                           "slabs/*.json", "demo/*.txt", "demo/sessions/*/*"]

# Vehicle packs (ADR-0013): the platform resolves its pack through this group.
[project.entry-points."ostler.vehicle"]
lr_d2 = "d2diag.vehicles.lr_d2:PACK"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
